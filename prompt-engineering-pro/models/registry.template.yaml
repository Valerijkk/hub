schema_version: "1.0"
registry_status: template
generated_at: null

catalog:
  runtime: cursor
  source_type: cursor_api_or_ui
  source_uri: "https://cursor.com/docs/cloud-agent/api/endpoints#list-models"
  observed_at: null
  account_or_team_scope: null
  restrictions_observed: []
  notes: "Заполняйте только из текущего каталога, видимого этому account/team."

defaults:
  orchestrator:
    requested_display_name: "GPT-5.6 Sol Pro"
    policy_source: "Требование активного Cursor profile"
    resolved_model_id: null
    resolution_status: unresolved
    unavailable_policy: "Применить playbooks/model-routing.md и залогировать fallback."
  downstream:
    selection: inherit
    override_policy: "Явный ID только когда текущий catalog и sourced fit это обосновывают."

rating_policy:
  allowed_values: [strong, adequate, weak, unknown]
  evidence_required_for_non_unknown: true
  benchmark_claim_policy: "Фиксируйте source, date, setup, metric и applicability; иначе unknown."

models:
  - id: "<exact id returned by current catalog>"
    display_name: "<catalog display name>"
    catalog_status: "<available|blocked|unavailable>"
    access:
      plan_allowed: null
      team_allowed: null
      regions_or_data_policy: unknown
    data_policy:
      provider_processor: unknown
      approved_regions: []
      retention: unknown
      training_use: unknown
      allowed_classifications: []
      approval_status: unknown
      approval_source: null
      approval_expires_at: null
    context:
      max_input_tokens: null
      max_output_tokens: null
      source_ref: null
    modes:
      tool_use: unknown
      image_input: unknown
      structured_output: unknown
      background_agents: unknown
    capabilities:
      orchestration: unknown
      coding: unknown
      code_review: unknown
      research: unknown
      debugging: unknown
      long_context: unknown
      instruction_following: unknown
    operations:
      latency_class: unknown
      cost_class: unknown
      reliability_risk: unknown
      supported_params: []
      variants: []
    evidence:
      - id: "<evidence-id>"
        kind: "<official-doc|catalog|project-eval|operator-observation>"
        source: "<url-or-artifact-path>"
        observed_at: null
        setup: "<task/dataset/runtime>"
        result: "<measured observation, not interpretation>"
        applies_to: ["<capability-field>"]
    notes: null

routing_policy:
  required_gates:
    - catalog_status_available
    - account_and_team_allowed
    - required_modes_supported
    - context_fit
    - data_classification_allowed
    - provider_processor_approved
    - region_retention_training_policy_approved
    - critical_capabilities_not_unknown
  preference_order:
    - task_strength_fit
    - risk_and_independence_fit
    - context_fit
    - latency_constraint
    - cost_constraint
  default_selection: inherit
  explicit_override_requires_evidence: true

decision_log_schema:
  decision_id: "<wave/task/run>"
  catalog_snapshot_at: null
  task_class: "<orchestrate|code|review|research|debug|docs|test>"
  complexity: "<low|medium|high>"
  risk: "<routine|important|critical>"
  context_data_classification: "<public|internal|confidential|restricted>"
  required:
    context: "<small|medium|large|unknown>"
    strengths: []
    tools: []
  candidates_considered:
    - model_id: "<catalog id>"
      fit: "<qualified|rejected|unknown>"
      evidence_refs: []
      rejection_reason: null
  selected:
    mode: "<inherit|explicit>"
    model_id: "<resolved id>"
    rationale: "<concise evidence-based rationale>"
    provider_processor: "<approved provider/processor>"
    region: "<approved processing region>"
    retention: "<approved retention policy>"
    training_use: "<allowed|prohibited|unknown>"
    data_policy_approval_source: "<human-or-policy record>"
    data_policy_approval_expires_at: null
  fallback_order: []
  approval_needed: true

fallback_log_schema:
  decision_id: "<same decision id>"
  attempted_model_id: "<catalog id>"
  resolved_model_id: "<actual id or null>"
  reason: "<unavailable|restricted|context|tool|runtime|budget|other>"
  action: "<next-qualified|inherit|split-task|stop-for-approval>"
  verification_impact: "<none|rerun-required|independence-limited|unknown>"
  recorded_at: null
