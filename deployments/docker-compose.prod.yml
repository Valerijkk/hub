# docker-compose.prod.yml — production-стек платформы Hub.
# Запуск: docker compose -f docker-compose.prod.yml --env-file .env up -d

services:

  # ========================================
  # Инфраструктура
  # ========================================

  postgres:
    image: postgres:17
    restart: unless-stopped
    # LO-Inf: mem_limit/cpus дублируют deploy.resources.limits (Swarm-only,
    # игнорируются `docker compose up`). Оставляем оба варианта для compose и Swarm.
    mem_limit: 1g
    cpus: 1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  nats:
    # A14-003: auth required in prod — credentials via NATS_USER/NATS_PASSWORD.
    image: nats:2.11
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    command:
      [
        "-js",
        "--store_dir", "/data",
        "--user", "${NATS_USER}",
        "--pass", "${NATS_PASSWORD}",
      ]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "nats-server", "--signal", "ldm"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  seaweedfs:
    # LO-Inf: pinned tag (раньше :latest — невоспроизводимый билд).
    # A14-002: s3.json генерируется из S3_* env (как LiveKit yaml) — не монтировать
    # committed seaweedfs-s3.json с hub/hubsecret (validate() запрещает в prod).
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    environment:
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {
          "identities": [
            {
              "name": "hub",
              "credentials": [
                {
                  "accessKey": "$${S3_ACCESS_KEY}",
                  "secretKey": "$${S3_SECRET_KEY}"
                }
              ],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            }
          ]
        }
        EOF
        exec weed server -s3 -dir=/data -s3.config=/tmp/s3.json
    volumes:
      - seaweeddata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  livekit:
    image: livekit/livekit-server:v1.8
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/livekit.yaml <<LKEOF
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
        keys:
          $${LIVEKIT_API_KEY}: $${LIVEKIT_API_SECRET}
        webhook:
          api_key: $${LIVEKIT_API_KEY}
          urls:
            - "http://backend:3000/api/calls/webhook"
        logging:
          level: info
        room:
          empty_timeout: 300
          # INF-01: дефолт LiveKit departure_timeout=20s ловит ICE-перeподключение
          # как пустую комнату — пользователь видит "звонок умер через ~30 секунд".
          # 120с даёт окно на восстановление NAT-смены/Wi-Fi-смены.
          departure_timeout: 120
          max_participants: 50
        LKEOF
        exec /livekit-server --config /tmp/livekit.yaml
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ========================================
  # Приложение
  # ========================================

  backend:
    image: ${IMAGE_BACKEND:-ghcr.io/valerijkk/hub/backend:latest}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      SERVER_PORT: "3000"
      FIBER_IMMUTABLE: "true"
      ENVIRONMENT: production
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      MONGODB_URL: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin"
      MONGODB_DATABASE: "${MONGO_DB:-hub}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      # A14-003: credentials in URL (nats.go UserInfo from URL). Avoid @/: in password.
      NATS_URL: "nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222"
      S3_ENDPOINT: "http://seaweedfs:8333"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
      S3_BUCKET: "${S3_BUCKET:-hub}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_USE_SSL: "false"
      JWT_SECRET: "${JWT_SECRET}"
      INTEGRATION_ENCRYPTION_KEY: "${INTEGRATION_ENCRYPTION_KEY}"
      CORS_ORIGINS: "${CORS_ORIGINS}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      RESEND_FROM_EMAIL: "${RESEND_FROM_EMAIL}"
      RESEND_FROM_ALERTS: "${RESEND_FROM_ALERTS:-alerts@hub.local}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      # hub-mail bridge: основной сервер ходит в микросервис почты по HTTP.
      # В контейнерной сети localhost не резолвится — нужен service DNS hub-mail.
      HUB_MAIL_URL: "http://hub-mail:3001"
      HUB_MAIL_INTERNAL_TOKEN: "${HUB_MAIL_INTERNAL_TOKEN}"
      LIVEKIT_URL: "http://livekit:7880"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
      DEV_MODE: "false"
      METRICS_ALLOWED_CIDRS: "${METRICS_ALLOWED_CIDRS:-}"
      ALERT_WEBHOOK_SECRET: "${ALERT_WEBHOOK_SECRET:-}"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      seaweedfs:
        condition: service_started
      hub-mail:
        condition: service_healthy
    # A14-001: readiness для depends_on (deps). Liveness в Dockerfile = /api/live.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # hub-mail — микросервис транзакционной/alert-почты (Phase 15.2, FA-05).
  # Использует тот же образ, что и backend (бинарь /app/hub-mail), но
  # переопределяет entrypoint. Держит RESEND_API_KEY, основной сервер
  # обращается к нему по HUB_MAIL_URL=http://hub-mail:3001.
  hub-mail:
    image: ${IMAGE_BACKEND:-ghcr.io/valerijkk/hub/backend:latest}
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    entrypoint: ["./hub-mail"]
    environment:
      HUB_MAIL_PORT: "3001"
      HUB_MAIL_INTERNAL_TOKEN: "${HUB_MAIL_INTERNAL_TOKEN}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      RESEND_FROM_EMAIL: "${RESEND_FROM_EMAIL}"
      RESEND_FROM_ALERTS: "${RESEND_FROM_ALERTS:-alerts@hub.local}"
      MAIL_DAILY_LIMIT: "${MAIL_DAILY_LIMIT:-20}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  frontend:
    image: ${IMAGE_FRONTEND:-ghcr.io/valerijkk/hub/frontend:latest}
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

volumes:
  pgdata:
  mongodata:
  redisdata:
  natsdata:
  seaweeddata:
  caddydata:
  caddyconfig:
