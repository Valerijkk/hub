# OPERATOR-ONLY BREAK-GLASS BOOTSTRAP. This file has no steady service and never publishes host ports.
# PRECONDITION: stop the steady Stalwart service before starting this container.
# STEP 1: Start the recovery server and one-shot apply client together with the same project name.
# INVOCATION: docker compose --project-name <same-project> -f deployments/docker-compose.mail.bootstrap.yml --profile bootstrap up stalwart-bootstrap stalwart-bootstrap-apply
# Use the same Compose project as production so `stalwart_data` resolves to the same
# <project>_stalwart_data volume. Run only this file/services, never them with the prod overlay.
# REVIEWED PLAN REQUIREMENT: the mounted NDJSON plan removes defaults and sets the explicit allowlist.
# CLEANUP: after a successful or failed run, stop/remove both containers and remove or unset the
# bootstrap user, password, and reviewed-plan-path variables. Never retain recovery credentials.
# A RocksDB/database-lock failure is a failed bootstrap: never override or bypass that lock.
services:
  stalwart-bootstrap:
    profiles: [bootstrap]
    image: stalwartlabs/stalwart:v0.16.18@sha256:0df5900cab389a8ec47b7521ef0681ec93598caf72a09097685845211861f6c2
    restart: 'no'
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    read_only: true
    security_opt:
      - 'no-new-privileges:true'
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      STALWART_RECOVERY_MODE: '1'
      STALWART_RECOVERY_MODE_PORT: '8080'
      STALWART_RECOVERY_ADMIN: '${STALWART_BOOTSTRAP_USER:?set STALWART_BOOTSTRAP_USER only for bootstrap}:${STALWART_BOOTSTRAP_PASSWORD:?set STALWART_BOOTSTRAP_PASSWORD only for bootstrap}'
    volumes:
      - ./stalwart/config.json:/etc/stalwart/config.json:ro
      - stalwart_data:/var/lib/stalwart
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - mail_bootstrap_control

  stalwart-bootstrap-apply:
    profiles: [bootstrap]
    image: stalwartlabs/cli:1.0.12@sha256:8831cc276c22e334bcf473fc7d28e21248d748c4bc1dac43c83738d3cbd3a9d5
    entrypoint: ['/usr/local/bin/stalwart-cli']
    command: ['apply', '--file', '/bootstrap/plan.ndjson']
    restart: 'no'
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    read_only: true
    security_opt:
      - 'no-new-privileges:true'
    environment:
      STALWART_URL: 'http://stalwart-bootstrap:8080'
      STALWART_USER: '${STALWART_BOOTSTRAP_USER:?set STALWART_BOOTSTRAP_USER only for bootstrap}'
      STALWART_PASSWORD: '${STALWART_BOOTSTRAP_PASSWORD:?set STALWART_BOOTSTRAP_PASSWORD only for bootstrap}'
    volumes:
      - '${STALWART_BOOTSTRAP_PLAN_PATH:?set absolute reviewed NDJSON plan path}:/bootstrap/plan.ndjson:ro'
    depends_on:
      stalwart-bootstrap:
        condition: service_started
    networks:
      - mail_bootstrap_control
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

volumes:
  stalwart_data:

networks:
  mail_bootstrap_control:
    internal: true
