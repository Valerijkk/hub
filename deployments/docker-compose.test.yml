# docker-compose.test.yml — минимальный стек для интеграционных тестов backend.
# Используется в CI и локально: docker compose -f deployments/docker-compose.test.yml up -d

services:
  postgres:
    image: postgres:17
    # Локальные тесты не должны монополизировать Docker Desktop. Значения
    # переопределяются через environment без изменения compose-файла.
    cpus: "${HUB_TEST_POSTGRES_CPUS:-1.0}"
    mem_limit: "${HUB_TEST_POSTGRES_MEMORY:-1536m}"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:8
    cpus: "${HUB_TEST_MONGO_CPUS:-1.0}"
    mem_limit: "${HUB_TEST_MONGO_MEMORY:-1536m}"
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: hub
      MONGO_INITDB_ROOT_PASSWORD: hub

  redis:
    image: redis:7.4-alpine
    cpus: "${HUB_TEST_REDIS_CPUS:-0.25}"
    mem_limit: "${HUB_TEST_REDIS_MEMORY:-512m}"
    ports:
      - "6379:6379"

  nats:
    image: nats:2.11
    cpus: "${HUB_TEST_NATS_CPUS:-0.25}"
    mem_limit: "${HUB_TEST_NATS_MEMORY:-512m}"
    ports:
      - "4222:4222"
    command: ["-js"]
