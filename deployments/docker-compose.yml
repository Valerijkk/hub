# docker-compose.yml — инфраструктурные сервисы для локальной разработки.
# Backend и frontend запускаются отдельно (make dev / go run / npm run dev).
# Запуск: docker compose -f deployments/docker-compose.yml up -d

services:
  # PostgreSQL — основная реляционная БД (Ent, миграции Atlas)
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB — сообщения мессенджера, Allure-отчёты TMS
  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: hub
      MONGO_INITDB_ROOT_PASSWORD: hub
    volumes:
      - mongodata:/data/db

  # Redis — сессии, refresh-токены, кэш
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

  # NATS JetStream — pub/sub между модулями (уведомления, fanout)
  nats:
    image: nats:2.11
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "--store_dir", "/data"]
    volumes:
      - natsdata:/data

  # SeaweedFS — S3-совместимое хранилище файлов
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-s3", "-dir=/data"]
    ports:
      - "9333:9333"
      - "8333:8333"
    volumes:
      - seaweeddata:/data

  # LiveKit — голосовые/видео звонки (WebRTC)
  livekit:
    image: livekit/livekit-server:v1.8
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: ["--config", "/etc/livekit.yaml"]

  # Caddy — reverse proxy (см. Caddyfile)
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile

volumes:
  pgdata:
  mongodata:
  natsdata:
  seaweeddata:
