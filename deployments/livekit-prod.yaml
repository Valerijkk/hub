## Конфигурация LiveKit для production (46.8.221.208).
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50060
  use_external_ip: true
keys:
  devkey: secret
webhook:
  api_key: devkey
  urls:
    - "http://backend:3000/api/calls/webhook"
logging:
  level: info
room:
  empty_timeout: 300
  max_participants: 50
  # Аудио качество
audio:
  active_sensitivity: 20
  min_volume_level: -30
  smooth_intervals: 2
