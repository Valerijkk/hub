## Конфигурация LiveKit для ЛОКАЛЬНОЙ разработки.
## В production конфиг генерируется из env vars (см. docker-compose.prod.yml).
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
keys:
  devkey-hub-local-development-2026: devsecret-hub-local-minimum-32-chars-ok
webhook:
  api_key: devkey-hub-local-development-2026
  urls:
    - "http://backend:3000/api/calls/webhook"
logging:
  level: info
room:
  empty_timeout: 300
  max_participants: 50
