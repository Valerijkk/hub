# Registry-owned private steady-state Stalwart service. Apply the reviewed
# steady-private.ndjson plan through the operator-only bootstrap flow first.
# It has no host ports; public ingress and external delivery require separate gates.
services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16.18@sha256:0df5900cab389a8ec47b7521ef0681ec93598caf72a09097685845211861f6c2
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      STALWART_HEALTHCHECK_URL: "http://127.0.0.1:8081/healthz/ready"
    networks:
      - mail_engine_internal
    expose:
      - "8081"
    volumes:
      - ./stalwart/config.json:/etc/stalwart/config.json:ro
      - stalwart_data:/var/lib/stalwart
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  clamav:
    image: clamav/clamav:1.5.4@sha256:0e85467cb0d6e7d860a45035707741cd5ffc032ffefc6002a3510c75b6d07027
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    networks:
      - mail_scan_private
    security_opt:
      - "no-new-privileges:true"
    expose:
      - "3310"
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      # Image-provided command, with explicit bounded Compose timings.
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 6m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  mail-dns-resolver:
    image: coredns/coredns:1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    read_only: true
    user: "65532:65532"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    command: ["-conf", "/etc/coredns/Corefile"]
    expose:
      - "53/tcp"
      - "53/udp"
    volumes:
      - ./coredns/mail-public.Corefile:/etc/coredns/Corefile:ro
    networks:
      - mail_dns_client
      - mail_dns_egress
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  backend:
    environment:
      # Private Registry-owned profile only. Backend must fail closed if an explicitly
      # enabled profile lacks required values; runtime acceptance remains NOT_RUN.
      MAILBOX_ENGINE_ENABLED: "${MAILBOX_ENGINE_ENABLED:-false}"
      MAILBOX_ENGINE_ORIGIN: "${MAILBOX_ENGINE_ORIGIN:-}"
      STALWART_PUBLIC_URL: "${STALWART_PUBLIC_URL:-}"
      MAILBOX_EXTERNAL_ENABLED: "false"
      MAILBOX_EXCLUSIVE_FOLDER_WRITER: "false"
      MAILBOX_INSTANCE_DOMAIN: "${MAILBOX_INSTANCE_DOMAIN:-}"
      MAILBOX_DOMAIN_VERIFICATION_MODE: "${MAILBOX_DOMAIN_VERIFICATION_MODE:-}"
      MAILBOX_ENGINE_MAIL_AUTH_MODE: "${MAILBOX_ENGINE_MAIL_AUTH_MODE:-}"
      MAILBOX_ENGINE_OAUTH_CLIENT_ID: "${MAILBOX_ENGINE_OAUTH_CLIENT_ID:-}"
      MAILBOX_ENGINE_OAUTH_CLIENT_SECRET: "${MAILBOX_ENGINE_OAUTH_CLIENT_SECRET:-}"
      MAILBOX_ENGINE_OAUTH_REDIRECT_URI: "${MAILBOX_ENGINE_OAUTH_REDIRECT_URI:-}"
      MAILBOX_S3_PRESIGN_ORIGIN: "${MAILBOX_S3_PRESIGN_ORIGIN:-}"
      MAILBOX_CLAMAV_INSTREAM_ADDRESS: "${MAILBOX_CLAMAV_INSTREAM_ADDRESS:-clamav:3310}"
      MAILBOX_ENGINE_REGISTRY_API_KEY: "${MAILBOX_ENGINE_REGISTRY_API_KEY:-}"
    # Wait for the pinned image's inherited private-profile readiness only; no Docker
    # or runtime acceptance follows from this source contract.
    depends_on:
      stalwart:
        condition: service_healthy
      clamav:
        condition: service_healthy
      mail-dns-resolver:
        condition: service_started
    networks:
      - default
      - mail_engine_internal
      - mail_scan_private
      - mail_dns_client

networks:
  mail_engine_internal:
    internal: true
  mail_dns_client:
    internal: true
  mail_dns_egress:
    driver: bridge
  # This ordinary private bridge is only for backend<->ClamAV and FreshClam
  # signature-refresh egress; no other service in this overlay attaches to it.
  mail_scan_private:

volumes:
  stalwart_data:
  clamav_signatures:
