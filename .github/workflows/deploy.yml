name: Build & Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "FA-06/PG-03 completed and CTO production sign-off received"
        required: true
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/valerijkk/hub/backend
  FRONTEND_IMAGE: ghcr.io/valerijkk/hub/frontend

jobs:
  build:
    if: github.ref == 'refs/heads/master' && inputs.confirm_production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && inputs.confirm_production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -euo pipefail
            SHA="${{ github.sha }}"
            BACKEND_IMAGE="ghcr.io/valerijkk/hub/backend:${SHA}"
            FRONTEND_IMAGE="ghcr.io/valerijkk/hub/frontend:${SHA}"

            docker pull "${BACKEND_IMAGE}"
            docker pull "${FRONTEND_IMAGE}"

            cd /opt/hub
            git fetch --no-tags origin refs/heads/master:refs/remotes/origin/master
            MASTER_SHA="$(git rev-parse refs/remotes/origin/master)"
            if [ "${MASTER_SHA}" != "${SHA}" ]; then
              echo "Refusing deployment: master advanced since dispatch"
              exit 1
            fi
            git reset --hard "${SHA}"

            cd deployments
            IMAGE_BACKEND="${BACKEND_IMAGE}" \
            IMAGE_FRONTEND="${FRONTEND_IMAGE}" \
            docker compose -f docker-compose.prod.yml --env-file .env -p hub up -d --force-recreate backend hub-mail livekit

            docker rm -f frontend 2>/dev/null || true
            docker run -d --name frontend \
              --network hub_default \
              --network-alias frontend \
              --restart unless-stopped \
              "${FRONTEND_IMAGE}"

            docker start hub-caddy-1 2>/dev/null || true
            docker restart hub-caddy-1 2>/dev/null || true

            docker image prune -af --filter "until=72h"
            docker builder prune -af

            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
                echo "Deployed ${SHA} $(cd /opt/hub && git log --oneline -1)"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed after deploy"
            exit 1
