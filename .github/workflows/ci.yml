name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Backend unit target is quarantined
        run: |
          echo "::error::NOT_READY: backend-unit is quarantined until the accepted testframework runner binds this CI target."
          exit 1

  # Coverage remains quarantined in this manual-only workflow.
  coverage-gate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Coverage target is quarantined
        run: |
          echo "::error::NOT_READY: coverage-gate is quarantined until a post-cutover coverage contract and accepted runner target exist."
          exit 1

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Frontend unit target is quarantined
        run: |
          echo "::error::NOT_READY: frontend-unit is quarantined until the accepted testframework runner binds this CI target."
          exit 1

  build:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - name: Build backend
        working-directory: backend
        run: |
          go generate ./ent
          go build -tags release -o bin/server ./cmd/server

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

  # FB-06 / NFR-17: manual-only Lighthouse artifact, non-blocking.
  lighthouse:
    if: github.event_name != 'pull_request'
    needs: [frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Chrome for Lighthouse
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Lighthouse CI (login page)
        working-directory: frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/login >/dev/null; then
              break
            fi
            sleep 2
          done
          LH_URL=http://127.0.0.1:4173/login npm run lighthouse:ci || true

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: |
            frontend/lighthouse-report.json
            frontend/lighthouse-summary.json
          retention-days: 14
          if-no-files-found: ignore
