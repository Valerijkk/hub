# Path-based PR labels (actions/labeler@v5)
backend:
  - changed-files:
      - any-glob-to-any-file: "backend/**"

frontend:
  - changed-files:
      - any-glob-to-any-file: "frontend/**"

docs:
  - changed-files:
      - any-glob-to-any-file: "docs/**"

planning:
  - changed-files:
      - any-glob-to-any-file: ".planning/**"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

e2e:
  - changed-files:
      - any-glob-to-any-file: "testframework/e2e/**"
