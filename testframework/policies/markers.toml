schema = "hub.testframework.markers/v1"
case_id_pattern = "^TC-[A-Z][A-Z0-9]*(?:-[A-Z][A-Z0-9]*)*-[0-9]{4}$"
statuses = ["active", "planned", "retired"]
scenarios = [
  "happy",
  "negative",
  "authn",
  "authz",
  "boundary",
  "edge",
  "corner",
  "failure-recovery",
  "security",
  "accessibility",
  "performance",
]
pytest_layers = ["contract", "api", "integration", "e2e"]
automation_kinds = ["pytest", "locust", "manual"]
