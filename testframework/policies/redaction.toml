schema = "hub.testframework.redaction/v1"
replacement = "[REDACTED]"
sensitive_key_fragments = [
  "authorization",
  "cookie",
  "token",
  "password",
  "secret",
  "api_key",
  "otp",
  "invite",
  "email",
]
value_patterns = [
  '(?i)bearer[ \t]+[a-z0-9._~+/\-=]+',
  '(?<![A-Za-z0-9_-])[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+(?![A-Za-z0-9_-])',
  'https?://[^\s@]+@[^\s]+',
  '(?i)(?<![a-f0-9])[a-f0-9]{32,}(?![a-f0-9])',
  '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}',
]
