# Private G0-C-L runner template only. Direct/public Compose invocation is
# forbidden. G0-B remains NOT_LOCK_BOUND / NOT_READY until the private runner
# strictly validates images.lock.v3.json and supplies the fixed target ImageId.
x-hub-qa-image-contract:
  status: NOT_LOCK_BOUND
  readiness: NOT_READY
  authority: private-g0-c-l-runner-only
  lock: testframework/docker/images.lock.v3.json
  selection: strict-fixed-target-image-id-and-control-commit
  direct_or_public_invocation: forbidden

services:
  backend-unit:
    image: ${BACKEND_UNIT_IMAGE_ID:?private G0-C-L validated images.lock.v3 backend-unit ImageId required}
    pull_policy: never
    platform: linux/amd64
    profiles: ["backend-unit"]
    container_name: ${HUB_QA_BACKEND_UNIT_CONTAINER_NAME:?task-owned name required}
    read_only: true
    network_mode: none
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      CI: "1"
      HOME: /tmp/home
      TMPDIR: /tmp
    volumes:
      - type: bind
        source: ${HUB_QA_REPORT_DIR:?task-owned report directory required}
        target: /reports
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g

  frontend-unit:
    image: ${FRONTEND_UNIT_IMAGE_ID:?private G0-C-L validated images.lock.v3 frontend-unit ImageId required}
    pull_policy: never
    platform: linux/amd64
    profiles: ["frontend-unit"]
    container_name: ${HUB_QA_FRONTEND_UNIT_CONTAINER_NAME:?task-owned name required}
    read_only: true
    network_mode: none
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      CI: "1"
      HOME: /tmp/home
      TMPDIR: /tmp
    volumes:
      - type: bind
        source: ${HUB_QA_REPORT_DIR:?task-owned report directory required}
        target: /reports
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g

  backend-openapi:
    image: ${BACKEND_OPENAPI_IMAGE_ID:?private G0-C-L validated images.lock.v3 backend-openapi ImageId required}
    pull_policy: never
    platform: linux/amd64
    profiles: ["backend-openapi"]
    container_name: ${HUB_QA_BACKEND_OPENAPI_CONTAINER_NAME:?task-owned name required}
    read_only: true
    network_mode: none
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      CI: "1"
      HOME: /tmp/home
      TMPDIR: /tmp
    volumes:
      - type: bind
        source: ${HUB_QA_REPORT_DIR:?task-owned report directory required}
        target: /reports
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g
