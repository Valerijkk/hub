# Private hub.qa-bootstrap/v1 topology.  Direct Docker or Compose invocation is
# forbidden; the outer bootstrap runner supplies each task-owned image ID and
# report directory only after A1 binding admission succeeds.
services:
  backend-unit:
    image: ${HUB_QA_BOOTSTRAP_BACKEND_UNIT_IMAGE_ID:?validated candidate backend-unit ImageId required}
    pull_policy: never
    platform: linux/amd64
    profiles: ["internal-only"]
    container_name: ${HUB_QA_BOOTSTRAP_BACKEND_UNIT_CONTAINER_NAME:?task-owned container name required}
    read_only: true
    network_mode: none
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      A1_BINDING_STATUS: "BOUND"
    volumes:
      - type: bind
        source: ${HUB_QA_BOOTSTRAP_REPORT_DIR:?task-owned report directory required}
        target: /reports
        bind:
          create_host_path: false

  frontend-unit:
    image: ${HUB_QA_BOOTSTRAP_FRONTEND_UNIT_IMAGE_ID:?validated candidate frontend-unit ImageId required}
    pull_policy: never
    platform: linux/amd64
    profiles: ["internal-only"]
    container_name: ${HUB_QA_BOOTSTRAP_FRONTEND_UNIT_CONTAINER_NAME:?task-owned container name required}
    read_only: true
    network_mode: none
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      A1_BINDING_STATUS: "BOUND"
    volumes:
      - type: bind
        source: ${HUB_QA_BOOTSTRAP_REPORT_DIR:?task-owned report directory required}
        target: /reports
        bind:
          create_host_path: false

  backend-openapi:
    image: ${HUB_QA_BOOTSTRAP_BACKEND_OPENAPI_IMAGE_ID:?validated candidate backend-openapi ImageId required}
    pull_policy: never
    platform: linux/amd64
    profiles: ["internal-only"]
    container_name: ${HUB_QA_BOOTSTRAP_BACKEND_OPENAPI_CONTAINER_NAME:?task-owned container name required}
    read_only: true
    network_mode: none
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      A1_BINDING_STATUS: "BOUND"
    volumes:
      - type: bind
        source: ${HUB_QA_BOOTSTRAP_REPORT_DIR:?task-owned report directory required}
        target: /reports
        bind:
          create_host_path: false

  g0-planning-selftest:
    image: ${HUB_QA_BOOTSTRAP_G0_PLANNING_SELFTEST_IMAGE_ID:?validated candidate planning selftest ImageId required}
    pull_policy: never
    platform: linux/amd64
    profiles: ["bootstrap"]
    container_name: ${HUB_QA_BOOTSTRAP_G0_PLANNING_SELFTEST_CONTAINER_NAME:?task-owned container name required}
    read_only: true
    network_mode: none
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      A1_BINDING_STATUS: "BOUND"
      HUB_QA_BOOTSTRAP_EXECUTION: "hub.qa-bootstrap/v1"
    volumes:
      - type: bind
        source: ${HUB_QA_BOOTSTRAP_REPORT_DIR:?task-owned report directory required}
        target: /reports
        bind:
          create_host_path: false
