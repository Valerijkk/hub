# CI pipeline stages (mirrors `.github/workflows/ci.yml`)

stages:
  - id: unit
    parallel: true
    jobs:
      - backend-test
      - frontend-test

  - id: build
    needs: [unit]
    jobs:
      - build

  - id: e2e
    jobs:
      - e2e-smoke   # needs: frontend-test
      - e2e-full    # needs: backend-test, frontend-test

  - id: quality
    when: master_push_or_dispatch
    jobs:
      - coverage-gate
      - lighthouse
