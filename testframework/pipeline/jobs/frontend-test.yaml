# Job: frontend-test (CI stage: unit)
job: frontend-test
stage: unit
working_directory: frontend
setup: node scripts/link-testframework-node-modules.mjs
commands:
  - npx tsc --noEmit
  - npx vitest run
  - npm run lint

code_root: testframework/stages/unit/frontend-test

domains:
  auth:
    - client-api.test.ts
    - auth-store.test.ts
    - use-auth.test.ts
    - profile-schema.test.ts
  admin:
    - admin-api.test.ts
    - audit-log.test.tsx
    - onec-settings.test.tsx
    - operation-metrics.test.tsx
  ai:
    - ai-api.test.ts
    - ai-store.test.ts
    - model-picker.test.tsx
    - use-composer-ai-suggest.test.ts
    - ai-privacy.test.tsx
  tracker:
    - issue-card.test.tsx
    - issue-form.test.tsx
    - user-picker.test.tsx
    - project-schema.test.ts
  messenger:
    - channel-icon.test.tsx
  tms:
    - case-table-row.test.tsx
  dashboard:
    - system-health.test.tsx
  platform:
    - context-help-tip.test.tsx
    - shortcuts-dialog.test.tsx
    - skip-link.test.tsx
    - error-boundary.test.tsx
    - validation-keys.test.ts
    - format-api-error.test.ts
    - sanitize-color.test.ts
  v4:
    - accounting-page.test.tsx
    - bases-page.test.tsx
    - unified-calendar.test.tsx
    - crm-page.test.tsx
    - leave-requests.test.tsx
    - news-feed.test.tsx
    - org-directory.test.tsx
    - random-coffee.test.tsx
    - marketplace-page.test.tsx
    - status-page.test.tsx
