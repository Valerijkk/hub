            additionalProperties:
              type: string
            type: object
        "403":
          description: Нет прав администратора
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Организация не настроена
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить org invite token
      tags:
