        "401":
          description: Не аутентифицирован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Нет прав администратора
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить режим регистрации
      tags:
      - Администрирование
    put:
