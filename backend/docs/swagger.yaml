host: localhost:3000
info:
  contact: {}
  description: 'Единая платформа для команд разработки и тестирования: трекер задач,
    мессенджер, TMS, созвоны.'
  title: Hub Platform API
  version: "1.0"
paths:
  /admin/audit:
    get:
      description: Возвращает пагинированный список записей аудита с фильтрацией.
      parameters:
      - description: Фильтр по действию
        in: query
        name: action
        type: string
      - description: Фильтр по типу сущности
        in: query
        name: entity_type
        type: string
      - description: Фильтр по ID пользователя
        in: query
        name: user_id
        type: string
      - description: Фильтр по ID проекта
        in: query
        name: project_id
        type: string
      - description: Начало периода (RFC3339)
        in: query
        name: date_from
        type: string
      - description: Конец периода (RFC3339)
        in: query
        name: date_to
        type: string
      - description: Только медленные HTTP-запросы (entity_type=http, duration_ms>500);
          значение 1
        in: query
        name: slow
        type: integer
      - description: Страница (по умолчанию 1)
        in: query
        name: page
        type: integer
      - description: Кол-во на странице (по умолчанию 50)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Записи аудита
          schema:
            $ref: '#/definitions/internal_audit.AuditLogListResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/fiber.Error'
        "403":
          description: Только для админа
          schema:
            $ref: '#/definitions/fiber.Error'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/fiber.Error'
      security:
      - BearerAuth: []
      summary: Журнал аудита
      tags:
      - Аудит
  /admin/backups:
    get:
      description: Возвращает все созданные резервные копии.
      produces:
      - application/json
      responses:
        "200":
          description: Список бэкапов
          schema:
            items:
              $ref: '#/definitions/internal_backup.BackupResponse'
            type: array
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/fiber.Error'
        "403":
          description: Только для админа
          schema:
            $ref: '#/definitions/fiber.Error'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/fiber.Error'
      security:
      - BearerAuth: []
      summary: Список бэкапов
      tags:
      - Резервное копирование
    post:
      description: Запускает создание резервной копии базы данных вручную.
      produces:
      - application/json
      responses:
        "201":
          description: Бэкап создан
          schema:
            $ref: '#/definitions/internal_backup.BackupResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/fiber.Error'
        "403":
          description: Только для админа
          schema:
            $ref: '#/definitions/fiber.Error'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/fiber.Error'
      security:
      - BearerAuth: []
      summary: Запустить бэкап
      tags:
      - Резервное копирование
  /admin/backups/{id}:
    delete:
      description: Удаляет резервную копию из хранилища.
      parameters:
      - description: ID бэкапа
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Бэкап удалён
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/fiber.Error'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/fiber.Error'
        "403":
          description: Только для админа
          schema:
            $ref: '#/definitions/fiber.Error'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/fiber.Error'
      security:
      - BearerAuth: []
      summary: Удалить бэкап
      tags:
      - Резервное копирование
  /admin/backups/{id}/restore:
    post:
      consumes:
      - application/json
      description: Восстанавливает базу данных из указанной резервной копии. Требует
        подтверждения.
      parameters:
      - description: ID бэкапа
        in: path
        name: id
        required: true
        type: string
      - description: 'Подтверждение: {confirm: RESTORE}'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_backup.RestoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Восстановление запущено
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный запрос или нет подтверждения
          schema:
            $ref: '#/definitions/fiber.Error'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/fiber.Error'
        "403":
          description: Только для админа
          schema:
            $ref: '#/definitions/fiber.Error'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/fiber.Error'
      security:
      - BearerAuth: []
      summary: Восстановить из бэкапа
      tags:
      - Резервное копирование
  /admin/limits:
    get:
      description: Возвращает текущие ограничения ресурсов системы.
      produces:
      - application/json
      responses:
        "200":
          description: Лимиты
          schema:
            items:
              $ref: '#/definitions/internal_audit.ResourceLimitResponse'
            type: array
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/fiber.Error'
        "403":
          description: Только для админа
          schema:
            $ref: '#/definitions/fiber.Error'
      security:
      - BearerAuth: []
      summary: Получить лимиты ресурсов
      tags:
      - Аудит
  /admin/limits/{key}:
    put:
      consumes:
      - application/json
      description: Обновляет значение ограничения ресурса по ключу.
      parameters:
      - description: Ключ лимита
        in: path
        name: key
        required: true
        type: string
      - description: Новое значение
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_audit.UpdateLimitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'success: true'
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/fiber.Error'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/fiber.Error'
        "403":
          description: Только для админа
          schema:
            $ref: '#/definitions/fiber.Error'
      security:
      - BearerAuth: []
      summary: Обновить лимит ресурса
      tags:
      - Аудит
  /admin/mail/broadcast:
    post:
      consumes:
      - application/json
      parameters:
      - description: Broadcast
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_mail.BroadcastRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_mail.BroadcastResponse'
      security:
      - BearerAuth: []
      summary: Admin email broadcast
      tags:
      - Администрирование
  /admin/mail/settings:
    get:
      description: Возвращает URL hub-mail, from address и лимиты (Phase 15.2, MAIL-01)
      produces:
      - application/json
      responses:
        "200":
          description: Настройки почты
          schema:
            $ref: '#/definitions/internal_mail.SettingsResponse'
        "401":
          description: Не аутентифицирован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Admin only
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить настройки hub-mail
      tags:
      - Администрирование
    put:
      consumes:
      - application/json
      description: Сохраняет hub_mail_url, from_alerts, alerts_enabled, daily_limit
        (Phase 15.2)
      parameters:
      - description: Настройки
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_mail.UpdateSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Обновлённые настройки
          schema:
            $ref: '#/definitions/internal_mail.SettingsResponse'
        "400":
          description: invalid body
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Не аутентифицирован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Admin only
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Обновить настройки hub-mail
      tags:
      - Администрирование
  /admin/observability/ops:
    get:
      description: Возвращает агрегаты duration/count/error по observability.Timed
        (OBS-01)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_valerii_hub_backend_internal_platform_observability.OperationMetric'
            type: array
        "403":
          description: Только для админа
          schema:
            $ref: '#/definitions/fiber.Error'
      security:
      - BearerAuth: []
      summary: In-memory метрики Timed()-операций
      tags:
      - Аудит
  /admin/organization/invite:
    get:
      description: Возвращает invite-токен организации для invite-only регистрации
