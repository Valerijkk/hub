schema_version: "1.0"
wrapper_template: wrapper.template.md
install_target: ".cursor/agents/<name>.md"
default_model: inherit

agents:
  - name: test-code-reviewer
    core_file: test-code-reviewer.md
    readonly: true
    description: "Ревьюит код тест-фреймворка на риски pattern, naming, value и flaky."
  - name: test-case-generator
    core_file: test-case-generator.md
    readonly: false
    description: "Генерирует трассируемые тест-кейсы из approved specs без выдуманных expectations."
  - name: test-debugger
    core_file: test-debugger.md
    readonly: false
    description: "Диагностирует и минимально чинит упавшие/flaky тесты после triage code-versus-test."
  - name: test-documenter
    core_file: test-documenter.md
    readonly: false
    description: "Держит guides, maps, traceability и coverage-документацию тест-фреймворка точными."
