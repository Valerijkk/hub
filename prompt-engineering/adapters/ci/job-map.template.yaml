schema_version: "1.0"
job:
  role: "<agent name>"
  system_policy:
    - prompt-engineering/rules/00-global-agent-rules.md
    - prompt-engineering/rules/50-data-handling.md
  core_prompt:
    - prompt-engineering/agents/README.md
    - "prompt-engineering/agents/<role>.md"
  task_contract: prompt-engineering/agents/templates/_MASTER-PROMPT-TEMPLATE.md
  source_revision: "<immutable revision>"
  diff_ref: "<base...head>"
  permissions:
    readonly: true
    allowed_paths: []
    denied_paths: []
    external_writes: false
  references:
    trust_level: untrusted_data
    delimiter: "BEGIN/END UNTRUSTED CONTEXT"
    context_cards: []
    pattern_cards: []
  approval:
    record_schema: prompt-engineering/adapters/APPROVAL-RECORD.schema.yaml
    authority: "<human-or-approved-policy>"
    record_path: "<immutable-approval-artifact>"
    embedded_approval_is_invalid: true
    reconfirm_external_or_destructive_action: true
  acceptance:
    done: []
    evidence_commands: []
    stopping_condition: "<condition>"
  routing:
    registry: prompt-engineering/models/registry.yaml
    decision_log: "<artifact path>"
    fallback_log: "<artifact path>"
  output:
    report: "<artifact path>"
    verification_required: true
    fail_on_unexpected_diff: true
