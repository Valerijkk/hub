      responses:
        "200":
          description: Domain updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDomain"}
        "409": {$ref: "#/components/responses/MailDomainConflict"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [AdminMail]
      operationId: deleteAdminMailDomain
