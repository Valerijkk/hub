                properties:
                  start_date: {type: string}
              - required: [end_date_exclusive]
                properties:
                  end_date_exclusive: {type: string}
        - required: [start_date, end_date_exclusive]
          properties:
            start_date: {type: string, format: date}
            end_date_exclusive: {type: string, format: date}
          not:
            anyOf:
              - required: [starts_at]
                properties:
                  starts_at: {type: string}
              - required: [ends_at]
                properties:
                  ends_at: {type: string}
      allOf:
        - if:
            properties:
              all_day: {const: true}
            required: [all_day]
          then:
            required: [starts_at, ends_at, start_date, end_date_exclusive]
            properties:
              starts_at: {type: "null"}
              ends_at: {type: "null"}
              start_date: {type: string, format: date}
              end_date_exclusive: {type: string, format: date}
        - if:
            properties:
              all_day: {const: false}
            required: [all_day]
          then:
            required: [starts_at, ends_at, start_date, end_date_exclusive]
            properties:
              starts_at: {type: string, format: date-time}
              ends_at: {type: string, format: date-time}
              start_date: {type: "null"}
              end_date_exclusive: {type: "null"}
      properties:
        title: {type: string, minLength: 1, maxLength: 500, x-hub-max-utf8-bytes: 500}
        description: {type: string, maxLength: 200000, x-hub-max-utf8-bytes: 200000}
        location: {type: string, maxLength: 500, x-hub-max-utf8-bytes: 500}
        starts_at: {type: [string, "null"], format: date-time}
        ends_at: {type: [string, "null"], format: date-time}
        start_date: {type: [string, "null"], format: date}
        end_date_exclusive: {type: [string, "null"], format: date}
        all_day: {type: boolean}
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          x-hub-max-utf8-bytes: 64
          description: Canonical name validated against the runtime IANA timezone database
          x-hub-validation: iana-timezone
        rrule:
          type: [string, "null"]
          maxLength: 1000
          x-hub-max-utf8-bytes: 1000
          description: Canonical RFC 5545 subset interpreted from DTSTART in the resulting event IANA timezone
        exdates:
          type: array
          maxItems: 1000
          items: {type: string, maxLength: 255, x-hub-max-utf8-bytes: 255}
        reminder_minutes:
          type: [integer, "null"]
          minimum: 0
          maximum: 40320
          description: >-
            Local scheduling metadata; null disables reminders. All-day due uses the first
            representable instant of the event-local civil start date. Reminder-only changes
            advance event version without invitation sequence/RSVP changes.
        attendees:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [email, role]
            properties:
              user_id: {type: [string, "null"], format: uuid}
              email: {type: string, format: email, maxLength: 320, x-hub-max-utf8-bytes: 320}
              display_name: {type: [string, "null"], maxLength: 160, x-hub-max-utf8-bytes: 640}
              role: {type: string, enum: [required, optional]}
