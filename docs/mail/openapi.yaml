              schema: {$ref: "#/components/schemas/MailMessageDetail"}
        "409": {$ref: "#/components/responses/MailAccountDeleting"}
        default: {$ref: "#/components/responses/Error"}
  /mail/messages/{messageId}/attachments/{attachmentId}/download:
    get:
      tags: [MailAttachments]
      operationId: downloadMailMessageAttachment
      x-hub-authz: mailbox-owner
      description: >-
        Streams one clean attachment from the exact owned account-scoped message. The request
        accepts no query parameters. The server validates the bounded engine account, blob,
        declared size, byte length and SHA-256, then rechecks the sealed local message snapshot
        after engine I/O. Provider identifiers and URLs are never exposed.
      parameters:
        - {$ref: "#/components/parameters/MessageId"}
        - {$ref: "#/components/parameters/AttachmentId"}
      responses:
        "200":
          description: Bounded attachment bytes forced to a non-rendering download response
          headers:
            Content-Disposition:
              required: true
              description: Server-generated attachment disposition with a safely encoded filename
              schema: {type: string, pattern: '^attachment; filename.*$'}
            Cache-Control:
              required: true
              schema: {const: no-store}
            Referrer-Policy:
              required: true
              schema: {const: no-referrer}
            X-Content-Type-Options:
              required: true
              schema: {const: nosniff}
          content:
            application/octet-stream:
              schema: {type: string, format: binary, maxLength: 26214400}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/MailAccountDeleting"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}
  /mail/messages/{messageId}/reply-draft:
    post:
      tags: [MailDrafts]
      operationId: createMailReplyDraft
      x-hub-authz: mailbox-owner
      description: >-
        Creates exactly one durable active reply draft from the owned source message. The source
        message id is accepted only from the canonical path parameter; the request accepts no
        query parameters, is one JSON object of at most 20 MiB raw bytes, and never returns 202.
      parameters:
        - {$ref: "#/components/parameters/MessageId"}
        - {$ref: "#/components/parameters/MailDraftCreateIdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMailReplyDraftRequest"}
      responses:
        "201":
          description: Durable active reply draft only, including a verified idempotent replay
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDraft"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Idempotency key reuse for a different reply intent, or a deleting mailbox account
          headers:
            X-Hub-Error-Code:
              required: true
              schema: {type: string, enum: [IDEMPOTENCY_KEY_REUSED, MAIL_ACCOUNT_DELETING]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "423": {$ref: "#/components/responses/MailAccountBusy"}
        "503": {$ref: "#/components/responses/Error"}
  /mail/messages/{messageId}/reply-all-draft:
    post:
      tags: [MailDrafts]
      operationId: createMailReplyAllDraft
      x-hub-authz: mailbox-owner
      description: >-
        Creates exactly one durable active Reply All draft from the owned source message. The
        server derives To and CC from the sealed source plus the complete bounded owner identity
        proof, never accepts client recipients, and never copies source BCC. The source message id
        is accepted only from the canonical path parameter; the request accepts no query parameters,
        is one JSON object of at most 20 MiB raw bytes, and never returns 202.
      parameters:
        - {$ref: "#/components/parameters/MessageId"}
        - {$ref: "#/components/parameters/MailDraftCreateIdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMailReplyDraftRequest"}
      responses:
        "201":
          description: Durable active Reply All draft only, including a verified idempotent replay
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDraft"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Idempotency key reuse for a different Reply All intent, or a deleting mailbox account
          headers:
            X-Hub-Error-Code:
              required: true
              schema: {type: string, enum: [IDEMPOTENCY_KEY_REUSED, MAIL_ACCOUNT_DELETING]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "423": {$ref: "#/components/responses/MailAccountBusy"}
        "503": {$ref: "#/components/responses/Error"}
  /mail/messages/{messageId}/forward-draft:
    post:
      tags: [MailDrafts]
      operationId: createMailForwardDraft
      x-hub-authz: mailbox-owner
      description: >-
        Creates exactly one durable active forward draft from the owned source message. The source
        message id is accepted only from the canonical path parameter; the request accepts no
        query parameters, is one JSON object of at most 20 MiB raw bytes, and never returns 202.
      parameters:
        - {$ref: "#/components/parameters/MessageId"}
        - {$ref: "#/components/parameters/MailDraftCreateIdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMailForwardDraftRequest"}
      responses:
        "201":
          description: Durable active forward draft only, including a verified idempotent replay
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDraft"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Idempotency key reuse for a different forward intent, or a deleting mailbox account
          headers:
            X-Hub-Error-Code:
              required: true
              schema: {type: string, enum: [IDEMPOTENCY_KEY_REUSED, MAIL_ACCOUNT_DELETING]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "423": {$ref: "#/components/responses/MailAccountBusy"}
        "503": {$ref: "#/components/responses/Error"}
  /mail/messages/{messageId}/remote-images/{imageToken}:
    get:
      tags: [MailMessages]
      operationId: proxyMailRemoteImage
      x-hub-authz: mailbox-owner
      description: Resolves only a server-issued token bound to this owned message; arbitrary URLs are not accepted.
      parameters:
        - {$ref: "#/components/parameters/MessageId"}
        - name: imageToken
          in: path
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 1024
            pattern: '^[A-Za-z0-9_-]{32,1024}$'
      responses:
        "200":
          description: Proxied bounded image bytes after owner reauthorization and SSRF-safe fetch; the origin URL is never returned
          headers:
            Cache-Control:
              required: true
              schema: {const: "private, max-age=300"}
            Content-Security-Policy:
              required: true
              schema: {const: "default-src 'none'; sandbox"}
            Referrer-Policy:
              required: true
              schema: {const: no-referrer}
            X-Content-Type-Options:
              required: true
              schema: {const: nosniff}
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        "409": {$ref: "#/components/responses/MailAccountDeleting"}
        default: {$ref: "#/components/responses/Error"}
  /mail/messages/bulk:
    post:
      tags: [MailMessages]
      operationId: bulkMutateMailMessages
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/MailMutationIdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BulkMailMutationRequest"}
      responses:
        "200":
          description: Per-request-target durable mutation result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BulkMailMutationResult"}
        "202":
          description: Persisted engine outcome is indeterminate and will reconcile only from the stored target/member snapshot; replay never re-expands scope
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BulkMailMutationResult"}
        "409": {$ref: "#/components/responses/MailMutationIdempotencyConflict"}
        "423": {$ref: "#/components/responses/MailAccountBusy"}
        "422": {$ref: "#/components/responses/MailBulkExpansionExceeded"}
        default: {$ref: "#/components/responses/Error"}
  /mail/drafts:
    post:
      tags: [MailDrafts]
      operationId: createMailDraft
      x-hub-authz: mailbox-owner
      description: >-
        Creates exactly one durable active draft. The request has no query parameters, is one
        JSON object of at most 20 MiB raw bytes, and never returns an indeterminate 202 result.
      parameters:
        - {$ref: "#/components/parameters/MailDraftCreateIdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMailDraftRequest"}
      responses:
        "201":
          description: Durable active draft only
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDraft"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/MailDraftIdempotencyConflict"}
        "413": {$ref: "#/components/responses/Error"}
        "423": {$ref: "#/components/responses/MailAccountBusy"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /mail/drafts/{draftId}:
    parameters:
      - {$ref: "#/components/parameters/DraftId"}
    get:
      tags: [MailDrafts]
      operationId: getMailDraft
      x-hub-authz: mailbox-owner
      description: Returns one owner-scoped active draft snapshot. Query parameters, request body and Content-Type are rejected; this read never reconciles a pending save.
      responses:
        "200":
          description: Current validated active draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDraft"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/MailDraftMutationConflict"}
        "503": {$ref: "#/components/responses/Error"}
    patch:
      tags: [MailDrafts]
      operationId: saveMailDraft
      x-hub-authz: mailbox-owner
      description: >-
        Saves one owner-scoped active draft under the exact quoted revision in `If-Match`.
        The request accepts no query parameters or `Idempotency-Key`, is one JSON object of at
        most 20 MiB raw bytes, and does not accept attachment, reply, forward, `Reply-To`,
        `In-Reply-To`, or `References` edits. For a reply draft, the server preserves its
        source/threading proof. This operation never returns 202.
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveMailDraftRequest"}
      responses:
        "200":
          description: Durable active draft only
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDraft"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Version precondition, durable reconciliation, or mailbox-deleting conflict
          headers:
            X-Hub-Error-Code:
              required: true
              schema: {type: string, enum: [MAIL_DRAFT_VERSION_CONFLICT, MAIL_DRAFT_RECONCILIATION_REQUIRED, MAIL_ACCOUNT_DELETING]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "423": {$ref: "#/components/responses/MailAccountBusy"}
        "503": {$ref: "#/components/responses/Error"}
  /mail/drafts/{draftId}/send:
    parameters:
      - {$ref: "#/components/parameters/DraftId"}
    post:
      tags: [MailDrafts]
      operationId: sendMailDraft
      x-hub-authz: mailbox-owner
      description: >-
        Creates or exactly replays one durable send intent for the quoted draft revision. The request
        accepts no query, body, or Content-Type and performs no provider operation. A 202 response is a
        durable receipt, not confirmation that delivery or sent-message projection has completed.
      parameters:
        - {$ref: "#/components/parameters/MailSubmissionIdempotencyKey"}
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "202":
          description: New or exactly replayed durable submission receipt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailSubmission"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/MailSubmissionConflict"}
        "503": {$ref: "#/components/responses/Error"}
  /mail/submissions/{submissionId}:
    parameters:
      - {$ref: "#/components/parameters/SubmissionId"}
    get:
      tags: [MailDrafts]
      operationId: getMailSubmission
      x-hub-authz: mailbox-owner
      description: >-
        Observes one owner-scoped durable submission receipt. The request accepts no query,
        body, or Content-Type and performs no provider, engine, reconciliation, or worker I/O.
      responses:
        "200":
          description: Current durable submission receipt
          headers:
            Cache-Control:
              required: true
              schema: {const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailSubmission"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/MailAccountDeleting"}
        "503": {$ref: "#/components/responses/Error"}
  /mail/attachments/presign:
    post:
      tags: [MailAttachments]
      operationId: presignMailAttachment
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/MailMutationIdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PresignAttachmentRequest"}
      responses:
        "200":
          description: Owner-bound upload contract. The request accepts no query parameters and requires a fresh UUID v4 or v7 Idempotency-Key kept stable for a retry of the same upload intent.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PresignAttachmentResponse"}
        "409":
          description: >-
            The idempotency key was reused for different input, its replay metadata expired, the
            attachment state conflicts, or the mailbox account is deleting. X-Hub-Error-Code is
            present only for MAIL_ACCOUNT_DELETING.
          headers:
            X-Hub-Error-Code:
              required: false
              schema: {const: MAIL_ACCOUNT_DELETING}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "503":
          description: Attachment staging or idempotency storage is temporarily unavailable
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        default: {$ref: "#/components/responses/Error"}
  /mail/attachments/{attachmentId}/confirm:
    post:
      tags: [MailAttachments]
      operationId: confirmMailAttachment
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/AttachmentId"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sha256, size_bytes]
              properties:
                sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
                size_bytes: {type: integer, format: int64, minimum: 1, maximum: 26214400}
      responses:
        "200":
          description: Current attachment state after confirmation. The request accepts no query parameters.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailAttachment"}
        "409": {$ref: "#/components/responses/MailAttachmentConfirmConflict"}
        "410": {$ref: "#/components/responses/MailAttachmentExpired"}
        "422":
          description: The claimed object metadata does not match or the attachment is not clean
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "503":
          description: Attachment staging is temporarily unavailable
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        default: {$ref: "#/components/responses/Error"}
  /mail/attachments/{attachmentId}/download:
    parameters:
      - {$ref: "#/components/parameters/AttachmentId"}
    get:
      tags: [MailAttachments]
      operationId: downloadMailAttachment
      x-hub-authz: mailbox-owner
      description: Returns a short-lived authorized object-store URL. The request accepts no query parameters.
      responses:
        "200":
          description: Short-lived object-store URL for an authorized clean linked attachment
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailAttachmentDownloadResponse"}
        default: {$ref: "#/components/responses/Error"}
  /mail/attachments/{attachmentId}:
    parameters:
      - {$ref: "#/components/parameters/AttachmentId"}
    delete:
      tags: [MailAttachments]
      operationId: deleteMailAttachment
      x-hub-authz: mailbox-owner
      description: >-
        Idempotently abandons one unlinked staged attachment. The request accepts neither query
        parameters nor a request body (including Content-Type). Unknown, foreign, and already
        abandoned attachments are deliberately indistinguishable and return 204.
      responses:
        "204": {description: Attachment is abandoned, absent, or outside the caller scope; no object-store deletion is performed inline.}
        "400":
          description: Invalid canonical attachment ID, query string, request body, or Content-Type
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "409":
          description: Attachment is linked to a message or draft, its storage state conflicts, or the mailbox account is deleting
          headers:
            X-Hub-Error-Code:
              required: false
              description: Present only when the resolved mailbox account is deleting
              schema: {const: MAIL_ACCOUNT_DELETING}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "503":
          description: Attachment abandonment is temporarily unavailable
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        default: {$ref: "#/components/responses/Error"}
  /mail/search:
    get:
      tags: [MailMessages]
      operationId: searchMail
      x-hub-authz: mailbox-owner
      description: Searches bounded owner-scoped From/To/subject/server-sanitized plain body and normalized attachment filename projections; every hit is reauthorized before identifiers or snippets are returned.
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 500}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
        - name: from
          in: query
          schema: {type: string, format: email}
        - name: to
          in: query
          schema: {type: string, format: email}
        - name: folder_id
          in: query
          schema: {type: string, format: uuid}
        - name: label_id
          in: query
          schema: {type: string, format: uuid}
        - name: unread
          in: query
          schema: {type: boolean}
        - name: has_attachments
          in: query
          schema: {type: boolean}
        - name: date_from
          in: query
          schema: {type: string, format: date-time}
        - name: date_to
          in: query
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: Authorized hydrated results; raw HTML/MIME/BCC/remote URLs are never search fields
