        "200":
          description: Configured instance domains
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                x-hub-max-serialized-utf8-bytes: 8388608
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/MailDomain"}
                  next_cursor: {type: [string, "null"], maxLength: 512}
        "403": {$ref: "#/components/responses/Forbidden"}
