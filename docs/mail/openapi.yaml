openapi: 3.1.0
info:
  title: Hub Mail and Calendar Sync API
  version: 0.1.8
  description: The five-document 0.1.8 entry amendment independently PASSed at 5e314fb080d420696642058ae47397e251c23207 and authorizes only 144-01A entry. Thread and Folder retain narrow static acceptances. The Rule implementation plan alone is docs/plan-only STATIC_ACCEPTED / EXACT_SHA_PASS at 669ef761715ec35a638bc87d8396e6f562b162c4 (sole path; blob b86c0423a307fd2673a3d322435922aa2a398e8f) after independent Contract/Spec/Oracle Terra/high, Security/Adversarial/Purity Terra/xhigh, and Lifecycle/Dependency/Boundary Terra/high PASS C/I/M 0/0/0; provenance dispatcher-enforced, fallback none, telemetry UNKNOWN unless exposed. Former Rule-plan author/adjudicate/accept instructions are CONSUMED/HISTORICAL. No source, Ent schema, generation, migration, service, runtime, product, phase, or release authority follows. Rule Task 1 remains NOT_AUTHORIZED/BLOCKED until all accepted non-marker Phase145 typed-IR/script carrier, G145-5B, G145-5C and launcher readiness, without implied order; post-task runtime NOT_RUN. Task4 docs sync is only after future source Task3 acceptance. 144-02D/02F retain docs-only acceptance; 144-01B remains Docker-blocked; Phase 142/148 and release remain pending; launcher NOT_READY and executables NOT_RUN.
servers:
  - url: /api
security:
  - bearerAuth: []
x-hub-bounded-pagination:
  max_serialized_utf8_bytes: 8388608
  behavior: Return fewer complete items with a non-null cursor; never truncate an item or emit a partial-success page.
x-hub-authz-vocabulary:
  version: 1
  operation_extension: x-hub-authz
  non_admin_requirement: exactly-one-declared-policy-id
  default_decision: deny
  opaque_resource_scope_miss:
    status: 404
    response: "#/components/responses/NotFound"
    disclose_existence: false
  policies:
    mailbox-self-status:
      scope: authenticated-user-mail-namespace
      principal_relation: self
      tenant_relation: same-organization
      resource_required: false
    mailbox-owner:
      scope: authenticated-user-mail-account
      principal_relation: owner
      tenant_relation: same-organization
    scheduled-call-create-member:
      scope: requested-project-and-exact-channel
      principal_relation: active-channel-member
      participant_relation: active-project-member
      tenant_relation: same-organization
    scheduled-call-channel-member:
      scope: exact-channel
      principal_relation: active-channel-member
      tenant_relation: same-organization
    scheduled-call-owner:
      scope: scheduled-call
      principal_relation: creator-owner
      tenant_relation: same-organization
    scheduled-call-conflict-visibility:
      scope: requested-participants
      principal_relation: authorized-requester
      participant_relation: active-same-organization
      detail_relation: active-exact-conflicting-channel-member
    calendar-aggregate-viewer:
      scope: current-user-calendar-aggregate
      principal_relation: source-authorized-viewer
      tenant_relation: same-organization
    calendar-event-create:
      scope: new-calendar-event
      principal_relation: organizer
      linked_call_relation: owned-active-unlinked-same-organization
    calendar-event-reader:
      scope: calendar-event
      principal_relation: organizer-or-internal-attendee
      tenant_relation: same-organization
      collection_filter_before_page_and_count: organizer-or-internal-attendee
    calendar-event-organizer:
      scope: calendar-event
      principal_relation: organizer
      tenant_relation: same-organization
    calendar-attendee-self:
      scope: calendar-attendee
      principal_relation: matching-internal-attendee
      tenant_relation: same-organization
    calendar-availability-shared:
      scope: complete-requested-user-set
      principal_relation: self-or-active-shared-project-or-channel
      tenant_relation: same-organization
      admin_bypass: false
    crm-deal-owner:
      scope: crm-deal
      principal_relation: deal-owner
      tenant_relation: same-organization
    crm-deal-message-owner:
      scope: crm-deal-and-mail-message
      principal_relation: deal-owner-and-mailbox-owner
      tenant_relation: same-organization
tags:
  - name: MailFolders
  - name: MailLabels
  - name: MailMessages
  - name: MailDrafts
  - name: MailAttachments
  - name: MailSettings
  - name: ScheduledCalls
  - name: CalendarEvents
  - name: CrmMail
  - name: AdminMail
paths:
  /mail/account:
    get:
      tags: [MailSettings]
      operationId: getMailAccountStatus
      x-hub-authz: mailbox-self-status
      description: Read-only safe mailbox provisioning state; this request never creates or mutates an engine account.
      responses:
        "200":
          description: Current owner mailbox availability and safe recovery state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailAccountStatus"}
        default: {$ref: "#/components/responses/Error"}
  /mail/folders:
    get:
      tags: [MailFolders]
      operationId: listMailFolders
      x-hub-authz: mailbox-owner
      responses:
        "200":
          description: Owner-scoped flat, parent-linked, deterministically ordered folder items and counters
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                x-hub-max-serialized-utf8-bytes: 8388608
                required: [items, projection_state, projection_as_of]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/MailFolder"}
                  projection_state: {$ref: "#/components/schemas/MailProjectionState"}
                  projection_as_of:
                    type: [string, "null"]
                    format: date-time
                    description: Last fully committed projection instant; non-null whenever projection_state is ready
                allOf:
                  - if:
                      properties:
                        projection_state: {const: ready}
                      required: [projection_state]
                    then:
                      properties:
                        projection_as_of: {type: string, format: date-time}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [MailFolders]
      operationId: createMailFolder
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/MailMutationIdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMailFolderRequest"}
      responses:
        "201":
          description: Folder created in engine and projected in Hub
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailFolder"}
        "202":
          description: Folder intent is safely pending or reconciling an indeterminate engine outcome
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailFolder"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/MailFolderCreateConflict"}
        "423": {$ref: "#/components/responses/MailAccountBusy"}
        "422": {$ref: "#/components/responses/MailFolderLimitExceeded"}
        default: {$ref: "#/components/responses/Error"}
  /mail/folders/{folderId}:
    parameters:
      - {$ref: "#/components/parameters/FolderId"}
    patch:
      tags: [MailFolders]
      operationId: updateMailFolder
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateMailFolderRequest"}
      responses:
        "200":
          description: Updated folder
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailFolder"}
        "202":
          description: Desired update persisted and engine outcome is pending reconciliation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailFolder"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/MailFolderMutationConflict"}
        "423": {$ref: "#/components/responses/MailAccountBusy"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [MailFolders]
      operationId: deleteMailFolder
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "204": {description: Custom folder deleted}
        "202":
          description: Delete intent persisted and engine outcome is pending reconciliation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailFolder"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/MailFolderMutationConflict"}
        "423": {$ref: "#/components/responses/MailAccountBusy"}
        default: {$ref: "#/components/responses/Error"}
  /mail/labels:
    get:
      tags: [MailLabels]
      operationId: listMailLabels
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: Labels
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                x-hub-max-serialized-utf8-bytes: 8388608
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/MailLabel"}
                  next_cursor: {type: [string, "null"], maxLength: 512}
              examples:
                bounded_page_with_continuation:
                  summary: Complete items only; the next item is deferred rather than truncated when the byte budget is reached
                  value:
                    items:
                      - id: 11111111-1111-4111-8111-111111111111
                        name: Important
                        color: "#d97706"
                        version: 3
                    next_cursor: eyJ2IjoxLCJhZnRlciI6IjExMTExMTExLTExMTEtNDExMS04MTExLTExMTExMTExMTExMSJ9
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [MailLabels]
      operationId: createMailLabel
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/MailMutationIdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpsertMailLabelRequest"}
      responses:
        "201":
          description: Label created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailLabel"}
        "409": {$ref: "#/components/responses/MailLabelCreateConflict"}
        "422": {$ref: "#/components/responses/MailLabelLimitExceeded"}
        default: {$ref: "#/components/responses/Error"}
  /mail/labels/{labelId}:
    parameters:
      - {$ref: "#/components/parameters/LabelId"}
    patch:
      tags: [MailLabels]
      operationId: updateMailLabel
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpsertMailLabelRequest"}
      responses:
        "200":
          description: Label updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailLabel"}
        "409": {$ref: "#/components/responses/MailLabelConflict"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [MailLabels]
      operationId: deleteMailLabel
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "204": {description: Label deleted and assignments removed}
        "409": {$ref: "#/components/responses/MailLabelConflict"}
        default: {$ref: "#/components/responses/Error"}
  /mail/threads:
    get:
      tags: [MailMessages]
      operationId: listMailThreads
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
        - name: folder_id
          in: query
          schema: {type: string, format: uuid}
        - name: label_id
          in: query
          schema: {type: string, format: uuid}
        - name: unread
          in: query
          schema: {type: boolean}
        - name: has_attachments
          in: query
          schema: {type: boolean}
      responses:
        "200":
          description: Cursor page of owner-scoped thread summaries
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailThreadPage"}
        default: {$ref: "#/components/responses/Error"}
  /mail/threads/{threadId}:
    get:
      tags: [MailMessages]
      operationId: getMailThread
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/ThreadId"}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: Thread and ordered message summaries
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailThreadDetail"}
        default: {$ref: "#/components/responses/Error"}
  /mail/messages/{messageId}:
    get:
      tags: [MailMessages]
      operationId: getMailMessage
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/MessageId"}
      responses:
        "200":
          description: Message with server-sanitized HTML, server-derived plain body and attachment metadata
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailMessageDetail"}
        default: {$ref: "#/components/responses/Error"}
  /mail/messages/{messageId}/remote-images/{imageToken}:
    get:
      tags: [MailMessages]
      operationId: proxyMailRemoteImage
      x-hub-authz: mailbox-owner
      description: Resolves only a server-issued token bound to this owned message; arbitrary URLs are not accepted.
      parameters:
        - {$ref: "#/components/parameters/MessageId"}
        - name: imageToken
          in: path
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 1024
            pattern: '^[A-Za-z0-9_-]{32,1024}$'
      responses:
        "200":
          description: Proxied bounded image bytes after owner reauthorization and SSRF-safe fetch; the origin URL is never returned
          headers:
            Cache-Control:
              required: true
              schema: {const: "private, max-age=300"}
            Content-Security-Policy:
              required: true
              schema: {const: "default-src 'none'; sandbox"}
            Referrer-Policy:
              required: true
              schema: {const: no-referrer}
            X-Content-Type-Options:
              required: true
              schema: {const: nosniff}
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        default: {$ref: "#/components/responses/Error"}
  /mail/messages/bulk:
    post:
      tags: [MailMessages]
      operationId: bulkMutateMailMessages
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/MailMutationIdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BulkMailMutationRequest"}
      responses:
        "200":
          description: Per-request-target mutation and classifier-feedback result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BulkMailMutationResult"}
        "202":
          description: Captured non-classifier engine state is indeterminate and will reconcile only from the persisted target/member snapshot; replay never re-expands scope
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BulkMailMutationResult"}
        "409": {$ref: "#/components/responses/MailMutationIdempotencyConflict"}
        "423": {$ref: "#/components/responses/MailAccountBusy"}
        "422": {$ref: "#/components/responses/MailBulkExpansionExceeded"}
        default: {$ref: "#/components/responses/Error"}
  /mail/drafts:
    post:
      tags: [MailDrafts]
      operationId: createMailDraft
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveDraftRequest"}
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDraft"}
        "409": {$ref: "#/components/responses/IdempotencyConflict"}
        "423": {$ref: "#/components/responses/MailAccountBusy"}
        default: {$ref: "#/components/responses/Error"}
  /mail/drafts/{draftId}:
    parameters:
      - {$ref: "#/components/parameters/DraftId"}
    get:
      tags: [MailDrafts]
      operationId: getMailDraft
      x-hub-authz: mailbox-owner
      responses:
        "200":
          description: Current draft revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDraft"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      tags: [MailDrafts]
      operationId: updateMailDraft
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveDraftRequest"}
      responses:
        "200":
          description: New draft revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDraft"}
        "409": {$ref: "#/components/responses/MailDraftMutationConflict"}
        "423": {$ref: "#/components/responses/MailAccountBusy"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [MailDrafts]
      operationId: deleteMailDraft
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "204": {description: Draft moved to trash or deleted by policy}
        "409": {$ref: "#/components/responses/MailDraftMutationConflict"}
        "423": {$ref: "#/components/responses/MailAccountBusy"}
        default: {$ref: "#/components/responses/Error"}
  /mail/drafts/{draftId}/send:
    post:
      tags: [MailDrafts]
      operationId: sendMailDraft
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/DraftId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "202":
          description: Submission accepted or reconciled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailSubmission"}
        "409": {$ref: "#/components/responses/MailSubmissionConflict"}
        "423": {$ref: "#/components/responses/MailAccountBusy"}
        default: {$ref: "#/components/responses/Error"}
  /mail/submissions/{submissionId}:
    get:
      tags: [MailDrafts]
      operationId: getMailSubmission
      x-hub-authz: mailbox-owner
      description: Returns the owner-scoped receipt; an unknown receipt is reconciled with the engine before another submit is allowed
      parameters:
        - {$ref: "#/components/parameters/SubmissionId"}
      responses:
        "200":
          description: Current reconciled submission state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailSubmission"}
        default: {$ref: "#/components/responses/Error"}
  /mail/attachments/presign:
    post:
      tags: [MailAttachments]
      operationId: presignMailAttachment
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/MailMutationIdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PresignAttachmentRequest"}
      responses:
        "201":
          description: Owner-bound upload contract; same-key replay mints a fresh URL only for the same pending unexpired attachment id and never extends the object lease
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PresignAttachmentResponse"}
        "409": {$ref: "#/components/responses/MailMutationIdempotencyConflict"}
        default: {$ref: "#/components/responses/Error"}
  /mail/attachments/{attachmentId}/confirm:
    post:
      tags: [MailAttachments]
      operationId: confirmMailAttachment
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/AttachmentId"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sha256, size_bytes]
              properties:
                sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
                size_bytes: {type: integer, format: int64, minimum: 1, maximum: 26214400}
      responses:
        "202":
          description: Attachment accepted for scan
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailAttachment"}
        "409": {$ref: "#/components/responses/MailAttachmentConfirmConflict"}
        "410": {$ref: "#/components/responses/MailAttachmentExpired"}
        default: {$ref: "#/components/responses/Error"}
  /mail/attachments/{attachmentId}:
    parameters:
      - {$ref: "#/components/parameters/AttachmentId"}
    get:
      tags: [MailAttachments]
      operationId: downloadMailAttachment
      x-hub-authz: mailbox-owner
      responses:
        "302":
          description: Short-lived redirect for an authorized clean attachment to the fixed configured mail-storage origin only
          headers:
            Location:
              required: true
              description: HTTPS URL minted by the mail storage port; never a client or provider supplied arbitrary origin
              schema: {type: string, format: uri, maxLength: 4096}
            Cache-Control:
              required: true
              schema: {const: no-store}
            Referrer-Policy:
              required: true
              schema: {const: no-referrer}
        "409": {$ref: "#/components/responses/MailAttachmentUnavailable"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [MailAttachments]
      operationId: deleteMailAttachment
      x-hub-authz: mailbox-owner
      responses:
        "204": {description: Unsent attachment deleted}
        default: {$ref: "#/components/responses/Error"}
  /mail/search:
    get:
      tags: [MailMessages]
      operationId: searchMail
      x-hub-authz: mailbox-owner
      description: Searches bounded owner-scoped From/To/subject/server-sanitized plain body and normalized attachment filename projections; every hit is reauthorized before identifiers or snippets are returned.
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 500}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
        - name: from
          in: query
          schema: {type: string, format: email}
        - name: to
          in: query
          schema: {type: string, format: email}
        - name: folder_id
          in: query
          schema: {type: string, format: uuid}
        - name: label_id
          in: query
          schema: {type: string, format: uuid}
        - name: unread
          in: query
          schema: {type: boolean}
        - name: has_attachments
          in: query
          schema: {type: boolean}
        - name: date_from
          in: query
          schema: {type: string, format: date-time}
        - name: date_to
          in: query
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: Authorized hydrated results; raw HTML/MIME/BCC/remote URLs are never search fields
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailThreadPage"}
        default: {$ref: "#/components/responses/Error"}
  /mail/contacts/suggest:
    get:
      tags: [MailMessages]
      operationId: suggestMailContacts
      x-hub-authz: mailbox-owner
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 30, default: 10}
      responses:
        "200":
          description: Active Hub users followed by recent external contacts
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                x-hub-max-serialized-utf8-bytes: 8388608
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 30
                    items: {$ref: "#/components/schemas/MailContact"}
        default: {$ref: "#/components/responses/Error"}
  /mail/settings:
    get:
      tags: [MailSettings]
      operationId: getMailUserSettings
      x-hub-authz: mailbox-owner
      responses:
        "200":
          description: User mailbox settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailUserSettings"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      tags: [MailSettings]
      operationId: updateMailUserSettings
      x-hub-authz: mailbox-owner
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateMailUserSettingsRequest"}
      responses:
        "200":
          description: Updated user settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailUserSettings"}
        "409": {$ref: "#/components/responses/MailUserSettingsConflict"}
        default: {$ref: "#/components/responses/Error"}
  /mail/identities:
    get:
      tags: [MailSettings]
      operationId: listMailIdentities
