        "200":
          description: Canonical event and attendee state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CalendarEventDetail"}
        "400":
          description: Invalid event ID, query string, request body, or Content-Type
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: Event does not exist or is not visible to the authenticated actor
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "500":
          description: Calendar event is unavailable; internal repository details are not exposed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
