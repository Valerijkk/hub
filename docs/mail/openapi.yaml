              schema: {$ref: "#/components/schemas/ScheduledCall"}
        "409": {$ref: "#/components/responses/LegacyScheduledCallMutationConflict"}
        "400": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [ScheduledCalls]
      operationId: deleteLegacyScheduledCall
      x-hub-authz: scheduled-call-owner
      description: Cancels the canonical event and soft-deletes/deactivates the call atomically
      responses:
        "200": {description: Event/call pair cancelled}
        "409": {$ref: "#/components/responses/LegacyScheduledCallMutationConflict"}
        default: {$ref: "#/components/responses/Error"}
