                properties:
                  scheduled_calls:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/ScheduledCall"}
        "400": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}
