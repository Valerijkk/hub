openapi: 3.1.0
info:
  title: Hub Mail and Calendar Sync API
  version: 0.1.4
  description: Frozen implementation contract. Presence in this file does not imply implementation.
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: MailFolders
  - name: MailLabels
  - name: MailMessages
  - name: MailDrafts
  - name: MailAttachments
  - name: MailSettings
  - name: CalendarEvents
  - name: CrmMail
  - name: AdminMail
paths:
  /mail/folders:
    get:
      tags: [MailFolders]
      operationId: listMailFolders
      responses:
        "200":
          description: Owner-scoped folder tree and counters
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/MailFolder"}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [MailFolders]
      operationId: createMailFolder
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMailFolderRequest"}
      responses:
        "201":
          description: Folder created in engine and projected in Hub
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailFolder"}
        default: {$ref: "#/components/responses/Error"}
  /mail/folders/{folderId}:
    parameters:
      - {$ref: "#/components/parameters/FolderId"}
    patch:
      tags: [MailFolders]
      operationId: updateMailFolder
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateMailFolderRequest"}
      responses:
        "200":
          description: Updated folder
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailFolder"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [MailFolders]
      operationId: deleteMailFolder
      responses:
        "204": {description: Custom folder deleted}
        default: {$ref: "#/components/responses/Error"}
  /mail/labels:
    get:
      tags: [MailLabels]
      operationId: listMailLabels
      responses:
        "200":
          description: Labels
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/MailLabel"}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [MailLabels]
      operationId: createMailLabel
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpsertMailLabelRequest"}
      responses:
        "201":
          description: Label created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailLabel"}
        default: {$ref: "#/components/responses/Error"}
  /mail/labels/{labelId}:
    parameters:
      - {$ref: "#/components/parameters/LabelId"}
    patch:
      tags: [MailLabels]
      operationId: updateMailLabel
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpsertMailLabelRequest"}
      responses:
        "200":
          description: Label updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailLabel"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [MailLabels]
      operationId: deleteMailLabel
      responses:
        "204": {description: Label deleted and assignments removed}
        default: {$ref: "#/components/responses/Error"}
  /mail/threads:
    get:
      tags: [MailMessages]
      operationId: listMailThreads
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
        - name: folder_id
          in: query
          schema: {type: string, format: uuid}
        - name: label_id
          in: query
          schema: {type: string, format: uuid}
        - name: unread
          in: query
          schema: {type: boolean}
        - name: has_attachments
          in: query
          schema: {type: boolean}
      responses:
        "200":
          description: Cursor page of owner-scoped thread summaries
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailThreadPage"}
        default: {$ref: "#/components/responses/Error"}
  /mail/threads/{threadId}:
    get:
      tags: [MailMessages]
      operationId: getMailThread
      parameters:
        - {$ref: "#/components/parameters/ThreadId"}
      responses:
        "200":
          description: Thread and ordered message summaries
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailThreadDetail"}
        default: {$ref: "#/components/responses/Error"}
  /mail/messages/{messageId}:
    get:
      tags: [MailMessages]
      operationId: getMailMessage
      parameters:
        - {$ref: "#/components/parameters/MessageId"}
      responses:
        "200":
          description: Message with sanitized HTML/plain body and attachment metadata
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailMessageDetail"}
        default: {$ref: "#/components/responses/Error"}
  /mail/messages/{messageId}/remote-images/{imageToken}:
    get:
      tags: [MailMessages]
      operationId: proxyMailRemoteImage
      description: Resolves only a server-issued token bound to this owned message; arbitrary URLs are not accepted.
      parameters:
        - {$ref: "#/components/parameters/MessageId"}
        - name: imageToken
          in: path
          required: true
          schema: {type: string, minLength: 32, maxLength: 1024}
      responses:
        "302":
          description: Redirect to a short-lived Hub-controlled cached image after SSRF-safe fetch
          headers:
            Location: {schema: {type: string, format: uri}}
        default: {$ref: "#/components/responses/Error"}
  /mail/messages/{messageId}/labels:
    put:
      tags: [MailLabels]
      operationId: replaceMailMessageLabels
      parameters:
        - {$ref: "#/components/parameters/MessageId"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label_ids]
              properties:
                label_ids:
                  type: array
                  uniqueItems: true
                  maxItems: 50
                  items: {type: string, format: uuid}
      responses:
        "200":
          description: Current labels
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/MailLabel"}
        default: {$ref: "#/components/responses/Error"}
  /mail/messages/bulk:
    post:
      tags: [MailMessages]
      operationId: bulkMutateMailMessages
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BulkMailMutationRequest"}
      responses:
        "200":
          description: Per-message mutation result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BulkMailMutationResult"}
        default: {$ref: "#/components/responses/Error"}
  /mail/drafts:
    post:
      tags: [MailDrafts]
      operationId: createMailDraft
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveDraftRequest"}
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDraft"}
        "409": {$ref: "#/components/responses/IdempotencyConflict"}
        default: {$ref: "#/components/responses/Error"}
  /mail/drafts/{draftId}:
    parameters:
      - {$ref: "#/components/parameters/DraftId"}
    get:
      tags: [MailDrafts]
      operationId: getMailDraft
      responses:
        "200":
          description: Current draft revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDraft"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      tags: [MailDrafts]
      operationId: updateMailDraft
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveDraftRequest"}
      responses:
        "200":
          description: New draft revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDraft"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [MailDrafts]
      operationId: deleteMailDraft
      responses:
        "204": {description: Draft moved to trash or deleted by policy}
        default: {$ref: "#/components/responses/Error"}
  /mail/drafts/{draftId}/send:
    post:
      tags: [MailDrafts]
      operationId: sendMailDraft
      parameters:
        - {$ref: "#/components/parameters/DraftId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "202":
          description: Submission accepted or reconciled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailSubmission"}
        "409": {$ref: "#/components/responses/IdempotencyConflict"}
        default: {$ref: "#/components/responses/Error"}
  /mail/submissions/{submissionId}:
    get:
      tags: [MailDrafts]
      operationId: getMailSubmission
      description: Returns the owner-scoped receipt; an unknown receipt is reconciled with the engine before another submit is allowed
      parameters:
        - {$ref: "#/components/parameters/SubmissionId"}
      responses:
        "200":
          description: Current reconciled submission state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailSubmission"}
        default: {$ref: "#/components/responses/Error"}
  /mail/attachments/presign:
    post:
      tags: [MailAttachments]
      operationId: presignMailAttachment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PresignAttachmentRequest"}
      responses:
        "201":
          description: Owner-bound SeaweedFS upload contract
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PresignAttachmentResponse"}
        default: {$ref: "#/components/responses/Error"}
  /mail/attachments/{attachmentId}/confirm:
    post:
      tags: [MailAttachments]
      operationId: confirmMailAttachment
      parameters:
        - {$ref: "#/components/parameters/AttachmentId"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha256, size_bytes]
              properties:
                sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
                size_bytes: {type: integer, format: int64, minimum: 0}
      responses:
        "202":
          description: Attachment accepted for scan
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailAttachment"}
        default: {$ref: "#/components/responses/Error"}
  /mail/attachments/{attachmentId}:
    parameters:
      - {$ref: "#/components/parameters/AttachmentId"}
    get:
      tags: [MailAttachments]
      operationId: downloadMailAttachment
      responses:
        "302":
          description: Short-lived safe download redirect for authorized clean attachment
          headers:
            Location: {schema: {type: string, format: uri}}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [MailAttachments]
      operationId: deleteMailAttachment
      responses:
        "204": {description: Unsent attachment deleted}
        default: {$ref: "#/components/responses/Error"}
  /mail/search:
    get:
      tags: [MailMessages]
      operationId: searchMail
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 500}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
        - name: from
          in: query
          schema: {type: string, format: email}
        - name: to
          in: query
          schema: {type: string, format: email}
        - name: folder_id
          in: query
          schema: {type: string, format: uuid}
        - name: label_id
          in: query
          schema: {type: string, format: uuid}
        - name: unread
          in: query
          schema: {type: boolean}
        - name: has_attachments
          in: query
          schema: {type: boolean}
        - name: date_from
          in: query
          schema: {type: string, format: date-time}
        - name: date_to
          in: query
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: Authorized hydrated search results
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailThreadPage"}
        default: {$ref: "#/components/responses/Error"}
  /mail/contacts/suggest:
    get:
      tags: [MailMessages]
      operationId: suggestMailContacts
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 30, default: 10}
      responses:
        "200":
          description: Active Hub users followed by recent external contacts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/MailContact"}
        default: {$ref: "#/components/responses/Error"}
  /mail/settings:
    get:
      tags: [MailSettings]
      operationId: getMailUserSettings
      responses:
        "200":
          description: User mailbox settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailUserSettings"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      tags: [MailSettings]
      operationId: updateMailUserSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateMailUserSettingsRequest"}
      responses:
        "200":
          description: Updated user settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailUserSettings"}
        default: {$ref: "#/components/responses/Error"}
  /mail/identities:
    get:
      tags: [MailSettings]
      operationId: listMailIdentities
      responses:
        "200":
          description: Server-authorized From identities for the current mailbox
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/MailIdentity"}
        default: {$ref: "#/components/responses/Error"}
  /mail/signatures:
    get:
      tags: [MailSettings]
      operationId: listMailSignatures
      responses:
        "200":
          description: Signatures
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/MailSignature"}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [MailSettings]
      operationId: createMailSignature
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpsertMailSignatureRequest"}
      responses:
        "201":
          description: Signature created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailSignature"}
        default: {$ref: "#/components/responses/Error"}
  /mail/signatures/{signatureId}:
    parameters:
      - name: signatureId
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [MailSettings]
      operationId: updateMailSignature
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpsertMailSignatureRequest"}
      responses:
        "200":
          description: Signature updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailSignature"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [MailSettings]
      operationId: deleteMailSignature
      responses:
        "204": {description: Signature deleted}
        default: {$ref: "#/components/responses/Error"}
  /mail/rules:
    get:
      tags: [MailSettings]
      operationId: listMailRules
      responses:
        "200":
          description: Typed user mail rules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/MailRule"}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [MailSettings]
      operationId: createMailRule
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpsertMailRuleRequest"}
      responses:
        "201":
          description: Rule validated, compiled and installed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailRule"}
        default: {$ref: "#/components/responses/Error"}
  /mail/rules/{ruleId}:
    parameters:
      - name: ruleId
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [MailSettings]
      operationId: updateMailRule
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpsertMailRuleRequest"}
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailRule"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [MailSettings]
      operationId: deleteMailRule
      responses:
        "204": {description: Rule deleted from Hub and engine}
        default: {$ref: "#/components/responses/Error"}
  /calendar/events:
    get:
      tags: [CalendarEvents]
      operationId: listLegacyCalendarAggregate
      deprecated: false
      description: Existing read-only aggregate; this contract preserves its exact public envelope
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: Existing aggregate of calls, sprints, deadlines and leave
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LegacyCalendarEventsResponse"}
        default: {$ref: "#/components/responses/Error"}
  /calendar/v2/events:
    get:
      tags: [CalendarEvents]
      operationId: listCanonicalCalendarEvents
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: include_cancelled
          in: query
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: Canonical first-class calendar events; the legacy GET /calendar/events aggregate remains unchanged
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/CalendarEvent"}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [CalendarEvents]
      operationId: createCalendarEvent
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpsertCalendarEventRequest"}
      responses:
        "201":
          description: Canonical event created and invitation queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CalendarEvent"}
        "409": {$ref: "#/components/responses/IdempotencyConflict"}
        default: {$ref: "#/components/responses/Error"}
  /calendar/v2/events/{eventId}:
    parameters:
      - {$ref: "#/components/parameters/EventId"}
    get:
      tags: [CalendarEvents]
      operationId: getCalendarEvent
      responses:
        "200":
          description: Canonical event and attendee state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CalendarEvent"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      tags: [CalendarEvents]
      operationId: updateCalendarEvent
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
        - name: notify_attendees
          in: query
          schema: {type: boolean, default: true}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateCalendarEventRequest"}
      responses:
        "200":
          description: Updated event with sequence and RSVP policy applied
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CalendarEvent"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [CalendarEvents]
      operationId: cancelCalendarEvent
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "200":
          description: Cancelled event with incremented sequence
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CalendarEvent"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}
  /calendar/v2/events/{eventId}/rsvp:
    post:
      tags: [CalendarEvents]
      operationId: respondToCalendarSeries
      parameters:
        - {$ref: "#/components/parameters/EventId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RsvpRequest"}
      responses:
        "200":
          description: Canonical series attendee response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CalendarAttendee"}
        "409": {$ref: "#/components/responses/CalendarMutationConflict"}
        default: {$ref: "#/components/responses/Error"}
  /calendar/v2/events/{eventId}/instances/{recurrenceId}/rsvp:
    post:
      tags: [CalendarEvents]
      operationId: respondToCalendarOccurrence
      parameters:
        - {$ref: "#/components/parameters/EventId"}
        - {$ref: "#/components/parameters/RecurrenceId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RsvpRequest"}
      responses:
        "200":
          description: Canonical occurrence-specific response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CalendarAttendee"}
        "409": {$ref: "#/components/responses/CalendarMutationConflict"}
        default: {$ref: "#/components/responses/Error"}
  /calendar/v2/events/{eventId}/instances/{recurrenceId}:
    delete:
      tags: [CalendarEvents]
      operationId: cancelCalendarOccurrence
      description: Cancels one recurrence instance by writing a canonical cancelled exception and sending an occurrence-scoped iTIP CANCEL
      parameters:
        - {$ref: "#/components/parameters/EventId"}
        - {$ref: "#/components/parameters/RecurrenceId"}
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "200":
          description: Cancelled occurrence; master event sequence and version incremented once
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CalendarOccurrenceCancellation"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}
  /calendar/v2/availability:
    post:
      tags: [CalendarEvents]
      operationId: getCalendarAvailability
      description: Returns private availability only for self or active same-organization users sharing a non-deleted project or active channel; admin/founder listing is not a bypass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_ids, from, to, timezone]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items: {type: string, format: uuid}
                from:
                  type: string
                  format: date-time
                  description: Inclusive start of a half-open range; range length is at most 31 days
                to:
                  type: string
                  format: date-time
                  description: Exclusive end of a half-open range; must be after from
                timezone:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Canonical name validated against the runtime IANA timezone database
                  x-hub-validation: iana-timezone
                slot_minutes:
                  type: integer
                  minimum: 5
                  maximum: 240
                  default: 30
                  description: Free gaps shorter than this requested duration are omitted
      responses:
        "200":
          description: Privacy-preserving busy and free intervals from events, calls and approved leave
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [users]
                properties:
                  users:
                    type: array
                    minItems: 1
                    maxItems: 50
                    items: {$ref: "#/components/schemas/UserAvailability"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/AvailabilityUnprocessable"}
        default: {$ref: "#/components/responses/Error"}
  /crm/deals/{dealId}/mail-compose-context:
    parameters:
      - {$ref: "#/components/parameters/DealId"}
    get:
      tags: [CrmMail]
      operationId: getCrmDealMailComposeContext
      description: Returns an authorized deal contact recipient only. The client may place it in the body of the ordinary idempotent POST /mail/drafts, then open the returned owner-scoped draft id; it must not place the recipient in a URL or use an alternate send path.
      responses:
        "200":
          description: Owner-scoped compose context
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CrmMailComposeContext"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/CrmMailComposeConflict"}
        default: {$ref: "#/components/responses/Error"}
  /crm/deals/{dealId}/mail-activities:
    parameters:
      - {$ref: "#/components/parameters/DealId"}
    get:
      tags: [CrmMail]
      operationId: listCrmDealMailActivities
      description: Lists bounded manual links for the authorized deal owner; CRM access does not delegate mailbox access
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: Newest-first manual mail activity links
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/CrmMailActivity"}
                  next_cursor: {type: [string, "null"], maxLength: 512}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
  /crm/deals/{dealId}/mail-activities/{messageId}:
    parameters:
      - {$ref: "#/components/parameters/DealId"}
      - {$ref: "#/components/parameters/MessageId"}
    put:
      tags: [CrmMail]
      operationId: linkCrmDealMailActivity
      x-hub-audit-action: crm.mail_activity.link
      description: Idempotently links an already projected message owned by the authenticated deal owner; no body hydration is required
      responses:
        "200":
          description: Existing or newly created immutable link
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CrmMailActivity"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/CrmMailActivityLimitConflict"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [CrmMail]
      operationId: unlinkCrmDealMailActivity
      x-hub-audit-action: crm.mail_activity.unlink
      description: Audited unlink of the owned message from the deal; the canonical mailbox message is unchanged
      responses:
        "204": {description: Link removed or already absent}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
  /admin/mail/settings:
    get:
      tags: [AdminMail]
      operationId: getLegacyAdminMailSettings
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.alert_settings.read
      responses:
        "200":
          description: Existing Resend alert settings; response shape remains backward compatible
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LegacyAdminMailSettings"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
    put:
      tags: [AdminMail]
      operationId: updateLegacyAdminMailSettings
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.alert_settings.update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateLegacyAdminMailSettingsRequest"}
      responses:
        "200":
          description: Existing Resend alert settings updated; no secret values returned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LegacyAdminMailSettings"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
  /admin/mail/broadcast:
    post:
      tags: [AdminMail]
      operationId: sendLegacyAdminMailBroadcast
      deprecated: true
      description: Existing admin broadcast compatibility route; conflicts with ADR-NOTIF-01 no-marketing policy and must be removed/disabled or explicitly re-authorized before mailbox acceptance
      x-hub-current-state: implemented-governance-gap
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.broadcast
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LegacyAdminMailBroadcastRequest"}
      responses:
        "200":
          description: Current dry-run or per-recipient best-effort broadcast counters
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LegacyAdminMailBroadcastResponse"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
  /admin/mail/mailbox-settings:
    get:
      tags: [AdminMail]
      operationId: getAdminMailboxSettings
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.mailbox_settings.read
      responses:
        "200":
          description: Mailbox engine policy; separate from legacy Resend alert settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminMailboxSettings"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
    put:
      tags: [AdminMail]
      operationId: updateAdminMailboxSettings
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.mailbox_settings.update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateAdminMailboxSettingsRequest"}
      responses:
        "200":
          description: Updated mailbox policy; no secret values returned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminMailboxSettings"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
  /admin/mail/domains:
    get:
      tags: [AdminMail]
      operationId: listAdminMailDomains
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.domains.list
      responses:
        "200":
          description: Configured instance domains
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/MailDomain"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [AdminMail]
      operationId: createAdminMailDomain
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.domains.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: {type: string, format: hostname, maxLength: 253}
      responses:
        "201":
          description: Domain provision request accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDomain"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
  /admin/mail/domains/{domainId}:
    parameters:
      - name: domainId
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [AdminMail]
      operationId: updateAdminMailDomain
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.domains.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: {type: boolean}
                make_default: {type: boolean}
      responses:
        "200":
          description: Domain updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDomain"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [AdminMail]
      operationId: deleteAdminMailDomain
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.domains.delete
      responses:
        "204": {description: Unused non-default domain removed}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
  /admin/mail/health:
    get:
      tags: [AdminMail]
      operationId: getAdminMailHealth
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.health.read
      responses:
        "200":
          description: Redacted engine and projection health
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailHealth"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque server-issued pagination token; clients must not parse or construct it
      schema: {type: string, maxLength: 512}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    FolderId:
      name: folderId
      in: path
      required: true
      schema: {type: string, format: uuid}
    LabelId:
      name: labelId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ThreadId:
      name: threadId
      in: path
      required: true
      schema: {type: string, format: uuid}
    MessageId:
      name: messageId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DraftId:
      name: draftId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EventId:
      name: eventId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DealId:
      name: dealId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RecurrenceId:
      name: recurrenceId
      in: path
      required: true
      description: Base64url-encoded normalized RFC 5545 RECURRENCE-ID
      schema:
        type: string
        minLength: 1
        maxLength: 342
        pattern: '^[A-Za-z0-9_-]+$'
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    NotFound:
      description: Resource or authorized scope not found; inaccessible and nonexistent identifiers use the same envelope
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Conflict:
      description: Optimistic version or idempotency conflict
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    AttendeeVersionConflict:
      description: RSVP attendee version is stale; client refetches the canonical event before retry
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: ATTENDEE_VERSION_CONFLICT}
        ETag:
          required: true
          description: Current attendee version in the same quoted-integer form as If-Match
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
        Location:
          required: true
          description: Same-origin canonical event path to refetch; clients must reject absolute or cross-origin values
          schema:
            type: string
            format: uri-reference
            pattern: '^/api/calendar/v2/events/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          example:
            error: rsvp state changed; reload the current attendee
            request_id: req_01JZZZZZZZZZZZZZZZZZZZZZZZ
    IdempotencyConflict:
      description: The idempotency key was already reserved for a different canonical request
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: IDEMPOTENCY_KEY_REUSED}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    CalendarMutationConflict:
      description: RSVP optimistic-version or idempotency-key conflict
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [ATTENDEE_VERSION_CONFLICT, IDEMPOTENCY_KEY_REUSED]
        ETag:
          required: false
          description: Present for ATTENDEE_VERSION_CONFLICT; current attendee version
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
        Location:
          required: false
          description: Present for ATTENDEE_VERSION_CONFLICT; same-origin canonical event path, never an absolute URL
          schema:
            type: string
            format: uri-reference
            pattern: '^/api/calendar/v2/events/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    AvailabilityUnprocessable:
      description: Authorized availability cannot be completed because expansion exceeded a frozen cap or an authorized source contains invalid calendar data; no partial result is returned
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [AVAILABILITY_LIMIT_EXCEEDED, AVAILABILITY_SOURCE_INVALID]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    CrmMailComposeConflict:
      description: The owned deal has no linked contact with a valid email recipient
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: CRM_MAIL_RECIPIENT_REQUIRED}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    CrmMailActivityLimitConflict:
      description: The deal already has the maximum 10,000 active mail activity links
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: CRM_MAIL_ACTIVITY_LIMIT}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Forbidden:
      description: Authenticated principal lacks the required role; resource existence is not disclosed
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  schemas:
    Address:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 320}
        name: {type: [string, "null"], maxLength: 160}
        user_id: {type: [string, "null"], format: uuid}
    MailFolder:
      type: object
      required: [id, name, unread_count, total_count, sort_order]
      properties:
        id: {type: string, format: uuid}
        parent_id: {type: [string, "null"], format: uuid}
        role:
          type: [string, "null"]
          enum: [inbox, sent, drafts, archive, trash, junk, null]
        name: {type: string, maxLength: 120}
        color: {type: [string, "null"], maxLength: 32}
        sort_order: {type: integer}
        unread_count: {type: integer, minimum: 0}
        total_count: {type: integer, minimum: 0}
    CreateMailFolderRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        parent_id: {type: [string, "null"], format: uuid}
        color: {type: [string, "null"], maxLength: 32}
    UpdateMailFolderRequest:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        parent_id: {type: [string, "null"], format: uuid}
        color: {type: [string, "null"], maxLength: 32}
        sort_order: {type: integer}
    MailLabel:
      type: object
      required: [id, name, color]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 60}
        color: {type: string, maxLength: 32}
    UpsertMailLabelRequest:
      type: object
      required: [name, color]
      properties:
        name: {type: string, minLength: 1, maxLength: 60}
        color: {type: string, minLength: 1, maxLength: 32}
    MailThreadSummary:
      type: object
      required: [id, subject, participants, message_count, unread_count, last_message_at, snippet, is_pinned, has_attachments, labels]
      properties:
        id: {type: string, format: uuid}
        subject: {type: string}
        participants:
          type: array
          items: {$ref: "#/components/schemas/Address"}
        message_count: {type: integer, minimum: 1}
        unread_count: {type: integer, minimum: 0}
        last_message_at: {type: string, format: date-time}
        snippet: {type: string, maxLength: 1200}
        is_pinned: {type: boolean}
        has_attachments: {type: boolean}
        labels:
          type: array
          items: {$ref: "#/components/schemas/MailLabel"}
    MailThreadPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/MailThreadSummary"}
        next_cursor: {type: [string, "null"]}
        projection_as_of: {type: string, format: date-time}
    MailMessageSummary:
      type: object
      required: [id, thread_id, from, to, subject, priority, size_bytes, has_attachments, is_draft, folder_ids, seen, flagged, answered, junk]
      properties:
        id: {type: string, format: uuid}
        thread_id: {type: string, format: uuid}
        from: {$ref: "#/components/schemas/Address"}
        to:
          type: array
          items: {$ref: "#/components/schemas/Address"}
        cc:
          type: array
          items: {$ref: "#/components/schemas/Address"}
        subject: {type: string}
        snippet: {type: string, maxLength: 1200}
        sent_at: {type: [string, "null"], format: date-time}
        received_at: {type: [string, "null"], format: date-time}
        priority: {type: string, enum: [low, normal, high]}
        size_bytes: {type: integer, format: int64, minimum: 0}
        has_attachments: {type: boolean}
        is_draft: {type: boolean}
        folder_ids:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
        seen: {type: boolean}
        flagged: {type: boolean}
        answered: {type: boolean}
        junk: {type: boolean}
        calendar_method: {type: [string, "null"], enum: [request, cancel, reply, null]}
        calendar_event_id: {type: [string, "null"], format: uuid}
    MailThreadDetail:
      allOf:
        - {$ref: "#/components/schemas/MailThreadSummary"}
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items: {$ref: "#/components/schemas/MailMessageSummary"}
    MailMessageDetail:
      allOf:
        - {$ref: "#/components/schemas/MailMessageSummary"}
        - type: object
          required: [plain_body, attachments]
          properties:
            plain_body: {type: string}
            sanitized_html: {type: [string, "null"]}
            remote_images_blocked: {type: boolean}
            attachments:
              type: array
              items: {$ref: "#/components/schemas/MailAttachment"}
            calendar: {oneOf: [{$ref: "#/components/schemas/CalendarEvent"}, {type: "null"}]}
    BulkMailMutationRequest:
      type: object
      required: [message_ids, action]
      properties:
        message_ids:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items: {type: string, format: uuid}
        action: {type: string, enum: [move, mark_read, mark_unread, flag, unflag, archive, junk, not_junk, trash, restore, pin, unpin]}
        folder_id: {type: [string, "null"], format: uuid}
    BulkMailMutationResult:
      type: object
      required: [succeeded, failed]
      properties:
        succeeded:
          type: array
          items: {type: string, format: uuid}
        failed:
          type: array
          items:
            type: object
            required: [message_id, code]
            properties:
              message_id: {type: string, format: uuid}
              code: {type: string}
    MailDraft:
      type: object
      required: [id, revision, status, from_identity_id, to, cc, bcc, subject, rich_body, plain_body, priority, attachment_ids, updated_at]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        status: {type: string, enum: [active, saving, unknown, submitting, submitted]}
        from_identity_id: {type: string, format: uuid}
        to:
          type: array
          items: {$ref: "#/components/schemas/Address"}
        cc:
          type: array
          items: {$ref: "#/components/schemas/Address"}
        bcc:
          type: array
          items: {$ref: "#/components/schemas/Address"}
        subject: {type: string, maxLength: 998}
        rich_body: {type: string}
        plain_body: {type: string}
        priority: {type: string, enum: [low, normal, high]}
        attachment_ids:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
        reply_to_message_id: {type: [string, "null"], format: uuid}
        forward_message_id: {type: [string, "null"], format: uuid}
        updated_at: {type: string, format: date-time}
    SaveDraftRequest:
      type: object
      required: [from_identity_id, to, cc, bcc, subject, rich_body, plain_body, priority, attachment_ids]
      properties:
        from_identity_id: {type: string, format: uuid}
        to:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/Address"}
        cc:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/Address"}
        bcc:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/Address"}
        subject: {type: string, maxLength: 998}
        rich_body: {type: string, maxLength: 2000000}
        plain_body: {type: string, maxLength: 2000000}
        priority: {type: string, enum: [low, normal, high], default: normal}
        attachment_ids:
          type: array
          uniqueItems: true
          maxItems: 50
          items: {type: string, format: uuid}
        reply_to_message_id: {type: [string, "null"], format: uuid}
        forward_message_id: {type: [string, "null"], format: uuid}
    MailSubmission:
      type: object
      required: [id, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [queued, submitting, sent, unknown, failed]}
        message_id: {type: [string, "null"], format: uuid}
        error_code: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PresignAttachmentRequest:
      type: object
      required: [draft_client_id, filename, media_type, size_bytes, disposition]
      properties:
        draft_client_id: {type: string, format: uuid}
        filename: {type: string, minLength: 1, maxLength: 255}
        media_type: {type: string, minLength: 1, maxLength: 255}
        size_bytes: {type: integer, format: int64, minimum: 1}
        disposition: {type: string, enum: [attachment, inline]}
        content_id: {type: [string, "null"], maxLength: 255}
    PresignAttachmentResponse:
      type: object
      required: [attachment_id, upload_url, expires_at, required_headers]
      properties:
        attachment_id: {type: string, format: uuid}
        upload_url: {type: string, format: uri}
        expires_at: {type: string, format: date-time}
        required_headers: {type: object, additionalProperties: {type: string}}
    MailAttachment:
      type: object
      required: [id, filename, media_type, size_bytes, disposition, scan_status, sha256]
      properties:
        id: {type: string, format: uuid}
        filename: {type: string}
        media_type: {type: string}
        size_bytes: {type: integer, format: int64, minimum: 0}
        disposition: {type: string, enum: [attachment, inline]}
        content_id: {type: [string, "null"]}
        scan_status: {type: string, enum: [pending, clean, rejected, error]}
        sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
    MailContact:
      allOf:
        - {$ref: "#/components/schemas/Address"}
        - type: object
          required: [source]
          properties:
            source: {type: string, enum: [hub_user, recent]}
            avatar_url: {type: [string, "null"], format: uri}
            presence: {type: [string, "null"]}
    MailIdentity:
      type: object
      required: [id, address, display_name, kind, send_allowed, is_default]
