      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.domains.delete
      responses:
        "202":
          description: Unused non-default domain marked deleting; worker confirms engine absence
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDomain"}
        "409": {$ref: "#/components/responses/MailDomainConflict"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
  /admin/mail/accounts/{userId}/identities:
    parameters:
      - name: userId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [AdminMail]
      operationId: listAdminMailIdentities
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.identities.list
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: Primary and per-user alias identities for one active same-organization mailbox
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                x-hub-max-serialized-utf8-bytes: 8388608
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/MailIdentity"}
                  next_cursor: {type: [string, "null"], maxLength: 512}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/MailAccountDeleting"}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [AdminMail]
      operationId: createAdminMailAlias
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.identities.create
      parameters:
        - {$ref: "#/components/parameters/MailMutationIdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMailAliasRequest"}
      responses:
        "202":
          description: Canonical alias intent accepted; pending alias is not selectable until account generation is deployed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailIdentity"}
        "409": {$ref: "#/components/responses/MailAliasCreateConflict"}
        "422": {$ref: "#/components/responses/MailIdentityLimitExceeded"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
  /admin/mail/accounts/{userId}/identities/{identityId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: identityId
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [AdminMail]
      operationId: deleteAdminMailAlias
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.identities.delete
      responses:
        "202":
          description: Non-primary alias marked deleting until account-control reconciliation confirms absence
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailIdentity"}
        "409": {$ref: "#/components/responses/MailAliasMutationConflict"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
  /admin/mail/health:
    get:
      tags: [AdminMail]
      operationId: getAdminMailHealth
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.health.read
      responses:
        "200":
          description: Redacted engine and projection health
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailHealth"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque server-issued pagination token; clients must not parse or construct it
      schema: {type: string, maxLength: 512}
      example: eyJ2IjoxLCJhZnRlciI6IjExMTExMTExLTExMTEtNDExMS04MTExLTExMTExMTExMTExMSJ9
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
      example: 33333333-3333-4333-8333-333333333333
    MailDraftCreateIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UTF-8 control-free key of 1 through 128 bytes, kept identical for every retry of one immutable draft-create intent
      schema: {type: string, minLength: 1, maxLength: 128, x-hub-max-utf8-bytes: 128}
    MailSubmissionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Exactly one UTF-8 control-free key of 1 through 128 bytes, kept identical for every retry of one immutable draft-send intent
      schema: {type: string, minLength: 1, maxLength: 128, x-hub-max-utf8-bytes: 128}
    MailMutationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Fresh client-generated UUID v4 or v7, kept stable for every retry of one generic mail intent
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[47][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    FolderId:
      name: folderId
      in: path
      required: true
      schema: {type: string, format: uuid}
    LabelId:
      name: labelId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ThreadId:
      name: threadId
      in: path
      required: true
      schema: {type: string, format: uuid}
    MessageId:
      name: messageId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DraftId:
      name: draftId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        not: {const: 00000000-0000-0000-0000-000000000000}
    EventId:
      name: eventId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DealId:
      name: dealId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RecurrenceId:
      name: recurrenceId
      in: path
      required: true
      description: Base64url-encoded normalized RFC 5545 RECURRENCE-ID
      schema:
        type: string
        minLength: 1
        maxLength: 342
        pattern: '^[A-Za-z0-9_-]+$'
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    NotFound:
      description: Resource or authorized scope not found; inaccessible and nonexistent identifiers use the same envelope
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailFolderLimitExceeded:
      description: The owned mailbox already has the maximum 100 non-deleted live folder slots; the reserved receipt terminally replays this failure and no folder or engine operation is created
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_FOLDER_LIMIT_EXCEEDED}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailFolderCreateConflict:
      description: >-
        Generic receipt conflict, sibling name collision or an unresolved folder intent; or the
        resolved MailAccount is deleting. For MAIL_ACCOUNT_DELETING, no receipt/replay,
        expansion, snapshot, storage or engine I/O ran.
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_REPLAY_UNAVAILABLE, IDEMPOTENCY_REPLAY_EXPIRED, MAIL_FOLDER_NAME_CONFLICT, MAIL_FOLDER_TREE_CONFLICT, MAIL_FOLDER_RECONCILIATION_REQUIRED, MAIL_RECONCILIATION_EXHAUSTED, MAIL_ACCOUNT_DELETING]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailFolderMutationConflict:
      description: >-
        Stale folder version, protected system role, active-rule reference, sibling name collision
        or unresolved prior intent; or the resolved MailAccount is deleting. For
        MAIL_ACCOUNT_DELETING, no receipt/replay, expansion, snapshot, storage or engine I/O ran.
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [MAIL_FOLDER_VERSION_CONFLICT, MAIL_FOLDER_SYSTEM_ROLE, MAIL_FOLDER_IN_USE, MAIL_FOLDER_NAME_CONFLICT, MAIL_FOLDER_TREE_CONFLICT, MAIL_FOLDER_RECONCILIATION_REQUIRED, MAIL_RECONCILIATION_EXHAUSTED, MAIL_ACCOUNT_DELETING]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailBulkExpansionExceeded:
      description: Thread/message targets expand to more than 200 distinct owned messages; no mutation or provider dispatch ran
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_BULK_EXPANSION_LIMIT}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailAccountBusy:
      description: >-
        Another engine command or reconciliation currently owns the account mutation
        lease; retry the same safe request after the bounded delay
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_ACCOUNT_BUSY}
          example: MAIL_ACCOUNT_BUSY
        Retry-After:
          required: true
          schema: {type: integer, minimum: 1, maximum: 5}
          example: 3
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          examples:
            account_busy:
              value:
                error: mailbox mutation is temporarily busy
                request_id: req_mail_busy_01
    MailAccountDeleting:
      description: >-
        The resolved MailAccount is in the non-interactive deleting state. The caller must poll
        GET /mail/account. The required owner-scoped account lookup runs, but no receipt
        create/replay/read, expansion/snapshot, or provider, engine, and worker I/O ran.
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_ACCOUNT_DELETING}
          example: MAIL_ACCOUNT_DELETING
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailAttachmentConfirmConflict:
      description: >-
        The owned attachment is no longer in the same confirmable state, or the resolved
        MailAccount is deleting. X-Hub-Error-Code is present only for MAIL_ACCOUNT_DELETING.
      headers:
        X-Hub-Error-Code:
          required: false
          schema: {const: MAIL_ACCOUNT_DELETING}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailAttachmentExpired:
      description: The pending upload lease expired; no confirm or scan transition runs
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailLabelConflict:
      description: >-
        Label version is stale, its normalized name collides, or an active rule still references
        it; or the resolved MailAccount is deleting. For MAIL_ACCOUNT_DELETING, no
        receipt/replay, expansion, snapshot, storage or engine I/O ran.
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [MAIL_LABEL_VERSION_CONFLICT, MAIL_LABEL_NAME_CONFLICT, MAIL_LABEL_IN_USE, MAIL_ACCOUNT_DELETING]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailDraftMutationConflict:
      description: >-
        Draft revision is stale, a prior save requires reconciliation, or its state is not
        editable/deletable; or the resolved MailAccount is deleting. For
        MAIL_ACCOUNT_DELETING, no receipt/replay, expansion, snapshot, storage or engine I/O ran.
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [MAIL_DRAFT_VERSION_CONFLICT, MAIL_DRAFT_RECONCILIATION_REQUIRED, MAIL_DRAFT_NOT_EDITABLE, MAIL_ACCOUNT_DELETING]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailSubmissionConflict:
      description: >-
        Send key was reused for changed input, the confirmed draft revision is stale, another
        submission owns the draft, or the draft is not sendable; or the resolved MailAccount is
        deleting. For MAIL_ACCOUNT_DELETING, no receipt/replay, expansion, snapshot, storage or
        engine I/O ran.
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [IDEMPOTENCY_KEY_REUSED, MAIL_DRAFT_VERSION_CONFLICT, MAIL_DRAFT_SUBMISSION_IN_PROGRESS, MAIL_DRAFT_NOT_SENDABLE, MAIL_ACCOUNT_DELETING]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailLabelCreateConflict:
      description: >-
        Generic receipt conflict or same-account normalized label-name collision; or the resolved
        MailAccount is deleting. For MAIL_ACCOUNT_DELETING, no receipt/replay, expansion,
        snapshot, storage or engine I/O ran.
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_REPLAY_UNAVAILABLE, IDEMPOTENCY_REPLAY_EXPIRED, MAIL_LABEL_NAME_CONFLICT, MAIL_ACCOUNT_DELETING]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailLabelLimitExceeded:
      description: The mailbox already has the maximum 100 non-deleted labels; the reserved receipt terminally replays this failure and no label is created
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_LABEL_LIMIT_EXCEEDED}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailUserSettingsConflict:
      description: >-
        User mailbox settings version is stale; or the resolved MailAccount is deleting. For
        MAIL_ACCOUNT_DELETING, no receipt/replay, expansion, snapshot, storage or engine I/O ran.
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {type: string, enum: [MAIL_SETTINGS_VERSION_CONFLICT, MAIL_ACCOUNT_DELETING]}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailSignatureConflict:
      description: >-
        Signature version is stale; or the resolved MailAccount is deleting. For
        MAIL_ACCOUNT_DELETING, no receipt/replay, expansion, snapshot, storage or engine I/O ran.
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {type: string, enum: [MAIL_SIGNATURE_VERSION_CONFLICT, MAIL_ACCOUNT_DELETING]}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailSignatureLimitExceeded:
      description: The mailbox already has the maximum 20 non-deleted signatures; the reserved receipt terminally replays this failure and no signature is created
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_SIGNATURE_LIMIT_EXCEEDED}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailRuleConflict:
      description: >-
        Rule version is stale; or the resolved MailAccount is deleting. For
        MAIL_ACCOUNT_DELETING, no receipt/replay, expansion, snapshot, storage or engine I/O ran.
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {type: string, enum: [MAIL_RULE_VERSION_CONFLICT, MAIL_ACCOUNT_DELETING]}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailRuleLimitExceeded:
      description: The mailbox already has the maximum 100 non-deleted rules; the reserved receipt terminally replays this failure and no rule or deployment generation is created
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_RULE_LIMIT_EXCEEDED}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailboxPolicyConflict:
      description: Mailbox-policy version is stale or the requested enablement prerequisites are not satisfied; no policy changes
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [MAILBOX_POLICY_VERSION_CONFLICT, MAILBOX_POLICY_PREREQUISITE]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailDomainCreateConflict:
      description: Generic receipt conflict or globally unavailable normalized domain; no tenant or provider detail is disclosed
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_REPLAY_UNAVAILABLE, IDEMPOTENCY_REPLAY_EXPIRED, MAIL_DOMAIN_UNAVAILABLE]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailDomainLimitExceeded:
      description: The organization already has the maximum 100 non-deleted mailbox domains; the reserved receipt terminally replays this failure and no domain or engine operation is created
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_DOMAIN_LIMIT_EXCEEDED}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailDomainConflict:
      description: Domain version or verified/default/reference invariant conflicts; no domain intent changes
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [MAIL_DOMAIN_VERSION_CONFLICT, MAIL_DOMAIN_NOT_VERIFIED, MAIL_DOMAIN_DEFAULT_CONFLICT, MAIL_DOMAIN_IN_USE]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailAliasCreateConflict:
      description: >-
        Generic receipt conflict, unavailable normalized address, or inactive target mailbox; or
        the resolved MailAccount is deleting. For MAIL_ACCOUNT_DELETING, no receipt/replay,
        expansion, snapshot, storage or engine I/O ran. No cross-tenant owner detail is disclosed.
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_REPLAY_UNAVAILABLE, IDEMPOTENCY_REPLAY_EXPIRED, MAIL_ALIAS_ADDRESS_UNAVAILABLE, MAIL_ALIAS_ACCOUNT_NOT_ACTIVE, MAIL_ACCOUNT_DELETING]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailIdentityLimitExceeded:
      description: The mailbox already has the maximum 200 identities including its primary identity; the reserved receipt terminally replays this failure and no alias or engine operation is created
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_IDENTITY_LIMIT_EXCEEDED}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailAliasMutationConflict:
      description: >-
        The identity is primary/group or its mailbox is not active; or the resolved MailAccount is
        deleting. For MAIL_ACCOUNT_DELETING, no receipt/replay, expansion, snapshot, storage or
        engine I/O ran.
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [MAIL_ALIAS_NOT_MUTABLE, MAIL_ALIAS_ACCOUNT_NOT_ACTIVE, MAIL_ACCOUNT_DELETING]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    IdempotencyConflict:
      description: A specialized draft, submission or legacy-call key was reused for changed input; the operation is not executed again
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: IDEMPOTENCY_KEY_REUSED}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailDraftIdempotencyConflict:
      description: >-
        Draft idempotency input changed, or the resolved MailAccount is deleting. For
        MAIL_ACCOUNT_DELETING, no receipt/replay, expansion, snapshot, storage or engine I/O ran.
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {type: string, enum: [IDEMPOTENCY_KEY_REUSED, MAIL_ACCOUNT_DELETING]}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailMutationIdempotencyConflict:
      description: >-
        The generic mail key was reused for changed input, its current target can no longer be
        reconstructed, its replay metadata expired, or the resolved MailAccount is deleting. For
        MAIL_ACCOUNT_DELETING, no receipt/replay, expansion, snapshot, storage or engine I/O ran.
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_REPLAY_UNAVAILABLE, IDEMPOTENCY_REPLAY_EXPIRED, MAIL_ACCOUNT_DELETING]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    CalendarCreateConflict:
      description: Idempotency reuse or an owned ScheduledCall cannot be attached without changing its locked canonical-mapped state
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [IDEMPOTENCY_KEY_REUSED, SCHEDULED_CALL_LINK_MISMATCH, SCHEDULED_CALL_NOT_ATTACHABLE]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    CalendarListBoundsExceeded:
      description: The requested canonical range exceeds 366 days or its bounded page cannot be represented without violating the cursor contract
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [CALENDAR_RANGE_TOO_LARGE, CALENDAR_PAGE_BOUND_EXCEEDED]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    LegacyScheduledCallMutationConflict:
      description: The linked canonical pair is already terminal or the requested pause/resume/update/delete transition cannot be applied; no mutation occurs
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: SCHEDULED_CALL_NOT_MUTABLE}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    CalendarEventPatchConflict:
      description: The event version is stale (and only this variant carries ETag and Location), its current terminal state forbids update, or PATCH attempts a recurrence-shape change after a materialized exception; no mutation occurs. Missing/foreign/nonorganizer events are 404 before version comparison.
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [CALENDAR_EVENT_VERSION_CONFLICT, CALENDAR_EVENT_NOT_MUTABLE, CALENDAR_EVENT_RECURRENCE_CONFLICT]
          example: CALENDAR_EVENT_VERSION_CONFLICT
        ETag:
          required: false
          description: Present only for CALENDAR_EVENT_VERSION_CONFLICT; current event version in quoted-integer form
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          example: '"7"'
        Location:
          required: false
          description: Present only for CALENDAR_EVENT_VERSION_CONFLICT; same-origin canonical event path, never an absolute URL
          schema:
            type: string
            format: uri-reference
            pattern: '^/api/calendar/v2/events/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          example: /api/calendar/v2/events/22222222-2222-4222-8222-222222222222
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          examples:
            stale_event_version:
              value:
                error: calendar event version is stale
                request_id: req_calendar_conflict_01
    CalendarEventDeleteConflict:
      description: The event version is stale (and only this variant carries ETag and Location) or its current terminal state forbids cancellation; no mutation occurs. Missing/foreign/nonorganizer events are 404 before version comparison.
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [CALENDAR_EVENT_VERSION_CONFLICT, CALENDAR_EVENT_NOT_MUTABLE]
          example: CALENDAR_EVENT_VERSION_CONFLICT
        ETag:
          required: false
          description: Present only for CALENDAR_EVENT_VERSION_CONFLICT; current event version in quoted-integer form
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          example: '"7"'
        Location:
          required: false
          description: Present only for CALENDAR_EVENT_VERSION_CONFLICT; same-origin canonical event path, never an absolute URL
          schema:
            type: string
            format: uri-reference
            pattern: '^/api/calendar/v2/events/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          example: /api/calendar/v2/events/22222222-2222-4222-8222-222222222222
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          examples:
            stale_event_version:
              value:
                error: calendar event version is stale
                request_id: req_calendar_conflict_01
    CalendarOccurrenceMutationConflict:
      description: The master event version is stale or the selected occurrence is not cancellable; no event, exception, call or outbox mutation occurs
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [CALENDAR_EVENT_VERSION_CONFLICT, CALENDAR_OCCURRENCE_NOT_MUTABLE]
        ETag:
          required: false
          description: Present for CALENDAR_EVENT_VERSION_CONFLICT; current master event version in quoted-integer form
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
        Location:
          required: false
          description: Present for CALENDAR_EVENT_VERSION_CONFLICT; same-origin canonical master event path, never an absolute URL
          schema:
            type: string
            format: uri-reference
            pattern: '^/api/calendar/v2/events/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    CalendarMutationConflict:
      description: RSVP optimistic-version or idempotency-key conflict
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [ATTENDEE_VERSION_CONFLICT, IDEMPOTENCY_KEY_REUSED]
        ETag:
          required: false
          description: Present for ATTENDEE_VERSION_CONFLICT; current attendee version
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
        Location:
          required: false
          description: Present for ATTENDEE_VERSION_CONFLICT; same-origin canonical event path, never an absolute URL
          schema:
            type: string
            format: uri-reference
            pattern: '^/api/calendar/v2/events/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    AvailabilityUnprocessable:
      description: Authorized availability cannot be completed because expansion exceeded a frozen cap or an authorized source contains invalid calendar data; no partial result is returned
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [AVAILABILITY_LIMIT_EXCEEDED, AVAILABILITY_SOURCE_INVALID]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    CrmMailComposeConflict:
      description: >-
        The owned deal has no linked contact with a valid email recipient; or the resolved
        MailAccount is deleting. For MAIL_ACCOUNT_DELETING, no receipt/replay, expansion,
        snapshot, storage or engine I/O ran.
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {type: string, enum: [CRM_MAIL_RECIPIENT_REQUIRED, MAIL_ACCOUNT_DELETING]}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    CrmMailActivityLimitConflict:
      description: >-
        The deal already has the maximum 10,000 active mail activity links; or the resolved
        MailAccount is deleting. For MAIL_ACCOUNT_DELETING, no receipt/replay, expansion,
        snapshot, storage or engine I/O ran.
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {type: string, enum: [CRM_MAIL_ACTIVITY_LIMIT, MAIL_ACCOUNT_DELETING]}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Forbidden:
      description: Authenticated principal lacks the required role; resource existence is not disclosed
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  schemas:
    Address:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 320, x-hub-max-utf8-bytes: 320}
        name: {type: [string, "null"], maxLength: 160, x-hub-max-utf8-bytes: 640}
        user_id: {type: [string, "null"], format: uuid}
    MailRecipientInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 320, x-hub-max-utf8-bytes: 320}
        name: {type: [string, "null"], maxLength: 160, x-hub-max-utf8-bytes: 640}
    MailAccountStatus:
      type: object
      additionalProperties: false
      required: [status, primary_address, retry_after_seconds, error_code, capabilities]
      allOf:
        - if:
            properties: {status: {const: deleting}}
            required: [status]
          then:
            properties:
              error_code: {const: null}
              capabilities:
                type: object
                additionalProperties: false
                required: [rich_content, rules, spam_training, remote_images]
                properties:
                  rich_content: {const: false}
                  rules: {const: false}
                  spam_training: {const: false}
                  remote_images: {const: false}
      properties:
        status:
          type: string
          enum: [not_configured, provisioning, active, suspended, error, deleting]
        primary_address:
          type: [string, "null"]
          format: email
          maxLength: 320
          x-hub-max-utf8-bytes: 320
        retry_after_seconds:
          type: [integer, "null"]
          minimum: 1
          maximum: 300
        error_code:
          type: [string, "null"]
          enum: [MAILBOX_ENGINE_DISABLED, MAILBOX_DOMAIN_REQUIRED, MAILBOX_PROVISIONING_RETRY, MAILBOX_SUSPENDED, MAILBOX_UNAVAILABLE, null]
        capabilities:
          type: object
          additionalProperties: false
          required: [rich_content, rules, spam_training, remote_images]
          properties:
            rich_content: {type: boolean}
            rules: {type: boolean}
            spam_training: {type: boolean}
            remote_images: {type: boolean}
    MailFolder:
      type: object
      additionalProperties: false
      required: [id, parent_id, role, name, unread_count, total_count, sort_order, state, version]
      properties:
        id: {type: string, format: uuid}
        parent_id: {type: [string, "null"], format: uuid}
        role:
          type: [string, "null"]
          enum: [inbox, sent, drafts, archive, trash, junk, null]
        name: {type: string, minLength: 1, maxLength: 120, x-hub-max-utf8-bytes: 480}
        color: {type: [string, "null"], minLength: 1, maxLength: 32, x-hub-max-utf8-bytes: 128}
        sort_order: {type: integer}
        unread_count: {type: integer, minimum: 0}
        total_count: {type: integer, minimum: 0}
        state: {type: string, enum: [creating, active, unknown, deleting, error]}
        version: {type: integer, minimum: 1}
    CreateMailFolderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120, x-hub-max-utf8-bytes: 480}
        parent_id: {type: [string, "null"], format: uuid}
        color: {type: [string, "null"], minLength: 1, maxLength: 32, x-hub-max-utf8-bytes: 128}
    UpdateMailFolderRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 120, x-hub-max-utf8-bytes: 480}
        parent_id: {type: [string, "null"], format: uuid, description: After nondisclosing target resolution and system-role guard, only a resolved custom target's supplied parent_id is temporarily rejected before receipt or engine I/O with MAIL_FOLDER_TREE_CONFLICT until a separately accepted engine-port reparent packet; missing target is 404 and system target is MAIL_FOLDER_SYSTEM_ROLE.}
        color: {type: [string, "null"], minLength: 1, maxLength: 32, x-hub-max-utf8-bytes: 128}
        sort_order: {type: integer}
    MailLabel:
      type: object
      additionalProperties: false
      required: [id, name, color, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 60, x-hub-max-utf8-bytes: 240}
        color: {type: string, minLength: 1, maxLength: 32, x-hub-max-utf8-bytes: 128}
        version: {type: integer, minimum: 1}
    UpsertMailLabelRequest:
      type: object
      additionalProperties: false
      required: [name, color]
      properties:
        name: {type: string, minLength: 1, maxLength: 60, x-hub-max-utf8-bytes: 240}
        color: {type: string, minLength: 1, maxLength: 32, x-hub-max-utf8-bytes: 128}
    MailThreadFields:
      type: object
      x-hub-internal-composition-only: true
      description: Field base used only by closed MailThreadSummary and MailThreadDetail wrappers; never an operation schema
      required: [id, subject, participants, message_count, unread_count, last_message_at, snippet, is_pinned, has_attachments, labels]
      properties:
        id: {type: string, format: uuid}
        subject: {type: string, maxLength: 998, x-hub-max-utf8-bytes: 998}
        participants:
          type: array
          minItems: 1
          maxItems: 401
          uniqueItems: true
          x-hub-max-serialized-utf8-bytes: 1048576
          items: {$ref: "#/components/schemas/MailThreadParticipant"}
        message_count: {type: integer, minimum: 1}
        unread_count: {type: integer, minimum: 0}
        last_message_at: {type: string, format: date-time}
        snippet: {type: string, maxLength: 1200, x-hub-max-graphemes: 400, x-hub-max-utf8-bytes: 4096}
        is_pinned: {type: boolean}
        has_attachments: {type: boolean}
        labels:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/MailLabel"}
    MailThreadSummary:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/MailThreadFields"}
    MailThreadParticipant:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 320, x-hub-max-utf8-bytes: 320}
    MailThreadPage:
      type: object
      additionalProperties: false
      x-hub-max-serialized-utf8-bytes: 8388608
      required: [items, next_cursor, projection_state, projection_as_of]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/MailThreadSummary"}
        next_cursor: {type: [string, "null"], maxLength: 512}
        projection_state: {$ref: "#/components/schemas/MailProjectionState"}
        projection_as_of:
          type: [string, "null"]
          format: date-time
          description: Last fully committed projection instant; non-null whenever projection_state is ready
      allOf:
        - if:
            properties:
              projection_state: {const: ready}
            required: [projection_state]
          then:
            properties:
              projection_as_of: {type: string, format: date-time}
    MailProjectionState:
      type: string
      enum: [bootstrapping, ready, degraded, rebuilding]
      description: >-
        Owner-visible freshness state for all sources behind the endpoint; search is ready
        only when both mailbox and owner index are ready. Any other value is stale/in-progress.
    MailMessageFields:
      type: object
      x-hub-internal-composition-only: true
      description: Field base used only by closed MailMessageSummary and MailMessageDetail wrappers; never an operation schema
      required: [id, thread_id, from, to, subject, priority, size_bytes, has_attachments, is_draft, folder_ids, seen, flagged, answered, junk]
      properties:
        id: {type: string, format: uuid}
        thread_id: {type: string, format: uuid}
        from: {$ref: "#/components/schemas/Address"}
        to:
          type: array
          maxItems: 200
          items: {$ref: "#/components/schemas/Address"}
        cc:
          type: array
          maxItems: 200
          items: {$ref: "#/components/schemas/Address"}
        subject: {type: string, maxLength: 998, x-hub-max-utf8-bytes: 998}
        snippet: {type: string, maxLength: 1200, x-hub-max-graphemes: 400, x-hub-max-utf8-bytes: 4096}
        sent_at: {type: [string, "null"], format: date-time}
        received_at: {type: [string, "null"], format: date-time}
        priority: {type: string, enum: [low, normal, high]}
        size_bytes: {type: integer, format: int64, minimum: 0, maximum: 52428800}
        has_attachments: {type: boolean}
        is_draft: {type: boolean}
        folder_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: string, format: uuid}
        seen: {type: boolean}
        flagged: {type: boolean}
        answered: {type: boolean}
        junk: {type: boolean}
        calendar_method: {type: [string, "null"], enum: [request, cancel, reply, null]}
    MailMessageSummary:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/MailMessageFields"}
    MailThreadDetail:
      unevaluatedProperties: false
      x-hub-max-serialized-utf8-bytes: 8388608
      allOf:
        - {$ref: "#/components/schemas/MailThreadFields"}
        - type: object
          required: [messages, next_cursor]
          properties:
            messages:
              type: array
              maxItems: 100
              items: {$ref: "#/components/schemas/MailMessageSummary"}
            next_cursor: {type: [string, "null"], maxLength: 512}
    MailMessageDetail:
      unevaluatedProperties: false
      x-hub-max-serialized-utf8-bytes: 52428800
      allOf:
        - {$ref: "#/components/schemas/MailMessageFields"}
        - type: object
          required: [plain_body, remote_images_blocked, attachments, calendar_event_id]
          properties:
            calendar_event_id:
              type: [string, "null"]
              format: uuid
              description: Authoritative derived link to the related Calendar event.
            plain_body:
              type: string
              maxLength: 2000000
              x-hub-max-utf8-bytes: 8388608
              description: Server-derived normalized plain text
            sanitized_html:
              type: [string, "null"]
              maxLength: 2000000
              x-hub-max-utf8-bytes: 8388608
              description: Server allowlist output; remote fetches are removed or rewritten only to this message's same-origin token route
            remote_images_blocked: {type: boolean}
            attachments:
              type: array
              maxItems: 50
              items: {$ref: "#/components/schemas/MailAttachment"}
            calendar: {oneOf: [{$ref: "#/components/schemas/CalendarEvent"}, {type: "null"}]}
    BulkMailMutationRequest:
      type: object
      additionalProperties: false
      required: [target_type, target_ids, action]
      properties:
        target_type: {type: string, enum: [message, thread]}
        target_ids:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items: {type: string, format: uuid}
        action: {type: string, enum: [move, mark_read, mark_unread, flag, unflag, trash]}
        folder_id: {type: string, format: uuid}
      oneOf:
        - properties:
            action: {const: move}
            folder_id: {type: string, format: uuid}
          required: [folder_id]
        - properties:
            action: {enum: [mark_read, mark_unread, flag, unflag, trash]}
            folder_id: false
    BulkMailMutationResult:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [target_type, target_id, status, affected_message_count, succeeded_message_count, failed_message_count, training_status, code]
            properties:
              target_type: {type: string, enum: [message, thread]}
              target_id: {type: string, format: uuid}
              status: {type: string, enum: [succeeded, partial, failed, unknown]}
              affected_message_count: {type: integer, minimum: 0, maximum: 200}
              succeeded_message_count: {type: integer, minimum: 0, maximum: 200}
              failed_message_count: {type: integer, minimum: 0, maximum: 200}
              training_status: {type: string, const: not_requested}
