  /admin/mail/broadcast:
    post:
      tags: [AdminMail]
      operationId: sendLegacyAdminMailBroadcast
      deprecated: true
      description: Existing admin broadcast compatibility route; conflicts with ADR-NOTIF-01 no-marketing policy and must be removed/disabled or explicitly re-authorized before mailbox acceptance
      x-hub-current-state: implemented-governance-gap
      x-hub-admission-status: blocked-pending-disable-or-removal
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.broadcast
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LegacyAdminMailBroadcastRequest"}
      responses:
        "200":
          description: Current dry-run or per-recipient best-effort broadcast counters
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LegacyAdminMailBroadcastResponse"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
  /admin/mail/mailbox-settings:
    get:
      tags: [AdminMail]
      operationId: getAdminMailboxSettings
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.mailbox_settings.read
      responses:
        "200":
          description: Mailbox engine policy; separate from legacy Resend alert settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminMailboxSettings"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
    put:
      tags: [AdminMail]
      operationId: updateAdminMailboxSettings
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.mailbox_settings.update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateAdminMailboxSettingsRequest"}
      responses:
        "200":
          description: Updated mailbox policy; no secret values returned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminMailboxSettings"}
        "409": {$ref: "#/components/responses/MailboxPolicyConflict"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
  /admin/mail/domains:
    get:
      tags: [AdminMail]
      operationId: listAdminMailDomains
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.domains.list
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: Configured instance domains
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                x-hub-max-serialized-utf8-bytes: 8388608
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/MailDomain"}
                  next_cursor: {type: [string, "null"], maxLength: 512}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [AdminMail]
      operationId: createAdminMailDomain
      parameters:
        - {$ref: "#/components/parameters/MailMutationIdempotencyKey"}
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.domains.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [domain]
              properties:
                domain: {type: string, format: hostname, maxLength: 253}
      responses:
        "202":
          description: Canonical domain intent accepted; engine/DNS state remains asynchronous
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDomain"}
        "409": {$ref: "#/components/responses/MailDomainCreateConflict"}
        "422": {$ref: "#/components/responses/MailDomainLimitExceeded"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
  /admin/mail/domains/{domainId}:
    parameters:
      - name: domainId
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [AdminMail]
      operationId: updateAdminMailDomain
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.domains.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                enabled: {type: boolean}
                make_default: {type: boolean}
      responses:
        "200":
          description: Domain updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDomain"}
        "409": {$ref: "#/components/responses/MailDomainConflict"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [AdminMail]
      operationId: deleteAdminMailDomain
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.domains.delete
      responses:
        "202":
          description: Unused non-default domain marked deleting; worker confirms engine absence
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDomain"}
        "409": {$ref: "#/components/responses/MailDomainConflict"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
  /admin/mail/accounts/{userId}/identities:
    parameters:
      - name: userId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [AdminMail]
      operationId: listAdminMailIdentities
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.identities.list
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: Primary and per-user alias identities for one active same-organization mailbox
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                x-hub-max-serialized-utf8-bytes: 8388608
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/MailIdentity"}
                  next_cursor: {type: [string, "null"], maxLength: 512}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [AdminMail]
      operationId: createAdminMailAlias
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.identities.create
      parameters:
        - {$ref: "#/components/parameters/MailMutationIdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMailAliasRequest"}
      responses:
        "202":
          description: Canonical alias intent accepted; pending alias is not selectable until account generation is deployed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailIdentity"}
        "409": {$ref: "#/components/responses/MailAliasCreateConflict"}
        "422": {$ref: "#/components/responses/MailIdentityLimitExceeded"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
  /admin/mail/accounts/{userId}/identities/{identityId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: identityId
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [AdminMail]
      operationId: deleteAdminMailAlias
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.identities.delete
      responses:
        "202":
          description: Non-primary alias marked deleting until account-control reconciliation confirms absence
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailIdentity"}
        "409": {$ref: "#/components/responses/MailAliasMutationConflict"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
  /admin/mail/health:
    get:
      tags: [AdminMail]
      operationId: getAdminMailHealth
      x-hub-rbac: admin
      x-hub-audit-action: mail.admin.health.read
      responses:
        "200":
          description: Redacted engine and projection health
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailHealth"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque server-issued pagination token; clients must not parse or construct it
      schema: {type: string, maxLength: 512}
      example: eyJ2IjoxLCJhZnRlciI6IjExMTExMTExLTExMTEtNDExMS04MTExLTExMTExMTExMTExMSJ9
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
      example: 33333333-3333-4333-8333-333333333333
    MailMutationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Fresh client-generated UUID v4 or v7, kept stable for every retry of one generic mail intent
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[47][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    FolderId:
      name: folderId
      in: path
      required: true
      schema: {type: string, format: uuid}
    LabelId:
      name: labelId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ThreadId:
      name: threadId
      in: path
      required: true
      schema: {type: string, format: uuid}
    MessageId:
      name: messageId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DraftId:
      name: draftId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EventId:
      name: eventId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DealId:
      name: dealId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RecurrenceId:
      name: recurrenceId
      in: path
      required: true
      description: Base64url-encoded normalized RFC 5545 RECURRENCE-ID
      schema:
        type: string
        minLength: 1
        maxLength: 342
        pattern: '^[A-Za-z0-9_-]+$'
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    NotFound:
      description: Resource or authorized scope not found; inaccessible and nonexistent identifiers use the same envelope
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailFolderLimitExceeded:
      description: The owned mailbox already has the maximum 100 non-deleted live folder slots; the reserved receipt terminally replays this failure and no folder or engine operation is created
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_FOLDER_LIMIT_EXCEEDED}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailFolderCreateConflict:
      description: Generic receipt conflict, sibling name collision or an unresolved folder intent; no new engine command runs
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_REPLAY_UNAVAILABLE, IDEMPOTENCY_REPLAY_EXPIRED, MAIL_FOLDER_NAME_CONFLICT, MAIL_FOLDER_TREE_CONFLICT, MAIL_FOLDER_RECONCILIATION_REQUIRED, MAIL_RECONCILIATION_EXHAUSTED]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailFolderMutationConflict:
      description: Stale folder version, protected system role, active-rule reference, sibling name collision or unresolved prior intent; no engine command runs
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [MAIL_FOLDER_VERSION_CONFLICT, MAIL_FOLDER_SYSTEM_ROLE, MAIL_FOLDER_IN_USE, MAIL_FOLDER_NAME_CONFLICT, MAIL_FOLDER_TREE_CONFLICT, MAIL_FOLDER_RECONCILIATION_REQUIRED, MAIL_RECONCILIATION_EXHAUSTED]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailBulkExpansionExceeded:
      description: Thread/message targets expand to more than 200 distinct owned messages; no mutation or classifier feedback ran
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_BULK_EXPANSION_LIMIT}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailAccountBusy:
      description: >-
        Another engine command or reconciliation currently owns the account mutation
        lease; retry the same safe request after the bounded delay
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_ACCOUNT_BUSY}
          example: MAIL_ACCOUNT_BUSY
        Retry-After:
          required: true
          schema: {type: integer, minimum: 1, maximum: 5}
          example: 3
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          examples:
            account_busy:
              value:
                error: mailbox mutation is temporarily busy
                request_id: req_mail_busy_01
    MailAttachmentConfirmConflict:
      description: Confirmation metadata changed or the owned attachment is no longer in the same confirmable state; no scan transition runs
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [MAIL_ATTACHMENT_CONFIRM_MISMATCH, MAIL_ATTACHMENT_STATE_CONFLICT]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailAttachmentExpired:
      description: The pending upload lease expired; no confirm or scan transition runs
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_ATTACHMENT_EXPIRED}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailAttachmentUnavailable:
      description: The owned attachment is not confirmed clean and cannot be downloaded
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_ATTACHMENT_NOT_CLEAN}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailLabelConflict:
      description: Label version is stale, its normalized name collides, or an active rule still references it; no label, assignment, marker or rule state changes
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [MAIL_LABEL_VERSION_CONFLICT, MAIL_LABEL_NAME_CONFLICT, MAIL_LABEL_IN_USE]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailDraftMutationConflict:
      description: Draft revision is stale, a prior save requires reconciliation, or its state is not editable/deletable; no draft or engine state changes
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [MAIL_DRAFT_VERSION_CONFLICT, MAIL_DRAFT_RECONCILIATION_REQUIRED, MAIL_DRAFT_NOT_EDITABLE]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailSubmissionConflict:
      description: Send key was reused for changed input, the confirmed draft revision is stale, another submission owns the draft, or the draft is not sendable; no second submit runs
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [IDEMPOTENCY_KEY_REUSED, MAIL_DRAFT_VERSION_CONFLICT, MAIL_DRAFT_SUBMISSION_IN_PROGRESS, MAIL_DRAFT_NOT_SENDABLE]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailLabelCreateConflict:
      description: Generic receipt conflict or same-account normalized label-name collision; no label is created
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_REPLAY_UNAVAILABLE, IDEMPOTENCY_REPLAY_EXPIRED, MAIL_LABEL_NAME_CONFLICT]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailLabelLimitExceeded:
      description: The mailbox already has the maximum 100 non-deleted labels; the reserved receipt terminally replays this failure and no label is created
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_LABEL_LIMIT_EXCEEDED}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailUserSettingsConflict:
      description: User mailbox settings version is stale; no setting changes
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_SETTINGS_VERSION_CONFLICT}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailSignatureConflict:
      description: Signature version is stale; no signature/default-setting changes
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_SIGNATURE_VERSION_CONFLICT}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailSignatureLimitExceeded:
      description: The mailbox already has the maximum 20 non-deleted signatures; the reserved receipt terminally replays this failure and no signature is created
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_SIGNATURE_LIMIT_EXCEEDED}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailRuleConflict:
      description: Rule version is stale; no rule or desired deployment generation changes
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_RULE_VERSION_CONFLICT}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailRuleLimitExceeded:
      description: The mailbox already has the maximum 100 non-deleted rules; the reserved receipt terminally replays this failure and no rule or deployment generation is created
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_RULE_LIMIT_EXCEEDED}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailboxPolicyConflict:
      description: Mailbox-policy version is stale or the requested enablement prerequisites are not satisfied; no policy changes
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [MAILBOX_POLICY_VERSION_CONFLICT, MAILBOX_POLICY_PREREQUISITE]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailDomainCreateConflict:
      description: Generic receipt conflict or globally unavailable normalized domain; no tenant or provider detail is disclosed
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_REPLAY_UNAVAILABLE, IDEMPOTENCY_REPLAY_EXPIRED, MAIL_DOMAIN_UNAVAILABLE]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailDomainLimitExceeded:
      description: The organization already has the maximum 100 non-deleted mailbox domains; the reserved receipt terminally replays this failure and no domain or engine operation is created
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_DOMAIN_LIMIT_EXCEEDED}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailDomainConflict:
      description: Domain version or verified/default/reference invariant conflicts; no domain intent changes
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [MAIL_DOMAIN_VERSION_CONFLICT, MAIL_DOMAIN_NOT_VERIFIED, MAIL_DOMAIN_DEFAULT_CONFLICT, MAIL_DOMAIN_IN_USE]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailAliasCreateConflict:
      description: Generic receipt conflict, unavailable normalized address, or inactive target mailbox; no cross-tenant owner detail is disclosed
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_REPLAY_UNAVAILABLE, IDEMPOTENCY_REPLAY_EXPIRED, MAIL_ALIAS_ADDRESS_UNAVAILABLE, MAIL_ALIAS_ACCOUNT_NOT_ACTIVE]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailIdentityLimitExceeded:
      description: The mailbox already has the maximum 200 identities including its primary identity; the reserved receipt terminally replays this failure and no alias or engine operation is created
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: MAIL_IDENTITY_LIMIT_EXCEEDED}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailAliasMutationConflict:
      description: The identity is primary/group or its mailbox is not active; no identity generation changes
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [MAIL_ALIAS_NOT_MUTABLE, MAIL_ALIAS_ACCOUNT_NOT_ACTIVE]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    IdempotencyConflict:
      description: A specialized draft, submission or legacy-call key was reused for changed input; the operation is not executed again
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: IDEMPOTENCY_KEY_REUSED}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    MailMutationIdempotencyConflict:
      description: The generic mail key was reused for changed input, its current target can no longer be reconstructed, or its replay metadata expired; none executes the operation again
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_REPLAY_UNAVAILABLE, IDEMPOTENCY_REPLAY_EXPIRED]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    CalendarCreateConflict:
      description: Idempotency reuse or an owned ScheduledCall cannot be attached without changing its locked canonical-mapped state
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [IDEMPOTENCY_KEY_REUSED, SCHEDULED_CALL_LINK_MISMATCH, SCHEDULED_CALL_NOT_ATTACHABLE]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    CalendarListBoundsExceeded:
      description: The requested canonical range exceeds 366 days or its bounded page cannot be represented without violating the cursor contract
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [CALENDAR_RANGE_TOO_LARGE, CALENDAR_PAGE_BOUND_EXCEEDED]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    LegacyScheduledCallMutationConflict:
      description: The linked canonical pair is already terminal or the requested pause/resume/update/delete transition cannot be applied; no mutation occurs
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: SCHEDULED_CALL_NOT_MUTABLE}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    CalendarEventMutationConflict:
      description: The event version is stale or its current terminal state forbids update/cancellation; no mutation occurs
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [CALENDAR_EVENT_VERSION_CONFLICT, CALENDAR_EVENT_NOT_MUTABLE]
          example: CALENDAR_EVENT_VERSION_CONFLICT
        ETag:
          required: false
          description: Present for CALENDAR_EVENT_VERSION_CONFLICT; current event version in quoted-integer form
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          example: '"7"'
        Location:
          required: false
          description: Present for CALENDAR_EVENT_VERSION_CONFLICT; same-origin canonical event path, never an absolute URL
          schema:
            type: string
            format: uri-reference
            pattern: '^/api/calendar/v2/events/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          example: /api/calendar/v2/events/22222222-2222-4222-8222-222222222222
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          examples:
            stale_event_version:
              value:
                error: calendar event version is stale
                request_id: req_calendar_conflict_01
    CalendarOccurrenceMutationConflict:
      description: The master event version is stale or the selected occurrence is not cancellable; no event, exception, call or outbox mutation occurs
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [CALENDAR_EVENT_VERSION_CONFLICT, CALENDAR_OCCURRENCE_NOT_MUTABLE]
        ETag:
          required: false
          description: Present for CALENDAR_EVENT_VERSION_CONFLICT; current master event version in quoted-integer form
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
        Location:
          required: false
          description: Present for CALENDAR_EVENT_VERSION_CONFLICT; same-origin canonical master event path, never an absolute URL
          schema:
            type: string
            format: uri-reference
            pattern: '^/api/calendar/v2/events/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    CalendarMutationConflict:
      description: RSVP optimistic-version or idempotency-key conflict
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [ATTENDEE_VERSION_CONFLICT, IDEMPOTENCY_KEY_REUSED]
        ETag:
          required: false
          description: Present for ATTENDEE_VERSION_CONFLICT; current attendee version
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
        Location:
          required: false
          description: Present for ATTENDEE_VERSION_CONFLICT; same-origin canonical event path, never an absolute URL
          schema:
            type: string
            format: uri-reference
            pattern: '^/api/calendar/v2/events/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    AvailabilityUnprocessable:
      description: Authorized availability cannot be completed because expansion exceeded a frozen cap or an authorized source contains invalid calendar data; no partial result is returned
      headers:
        X-Hub-Error-Code:
          required: true
          schema:
            type: string
            enum: [AVAILABILITY_LIMIT_EXCEEDED, AVAILABILITY_SOURCE_INVALID]
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    CrmMailComposeConflict:
      description: The owned deal has no linked contact with a valid email recipient
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: CRM_MAIL_RECIPIENT_REQUIRED}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    CrmMailActivityLimitConflict:
      description: The deal already has the maximum 10,000 active mail activity links
      headers:
        X-Hub-Error-Code:
          required: true
          schema: {const: CRM_MAIL_ACTIVITY_LIMIT}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Forbidden:
      description: Authenticated principal lacks the required role; resource existence is not disclosed
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
