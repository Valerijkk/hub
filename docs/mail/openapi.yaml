info:
  title: Hub Mail and Calendar Sync API
  version: 0.1.8
  x-hub-task-4-api-authority: >-
    Task-4 authority gate: this document is the sole normative schema, route, authz, error, compatibility, and operation contract for the bounded public Mail/Calendar HTTP surface. `operationId`, `x-hub-authz`, and components in this document are the required contract inputs for each later atom. `backend/docs/swagger.yaml` and `backend/docs/swagger.json` are legacy/general Hub Swag outputs and are non-authoritative for this bounded surface pending separately approved migration. Frontend clients remain handwritten domain adapters in `frontend/src/api/mail.ts` and `frontend/src/api/calendar.ts`; do not add code generation or a third route manifest. Each future Task-4 HTTP atom requires one reviewed change set containing its normative OAS operation/schema, authenticated owner-scoped backend handler and wiring, and matching handwritten typed client wrapper. This authority declaration changes no operation or schema and does not assert that declared routes exist or pass: implementation evidence is static-only and runtime is NOT_RUN; executable behavior belongs later in `testframework/tests/api/**`.
  x-hub-calendar-143-04h-source-receipt-sync: >-
    Status metadata only: SOURCE_RECEIPT_SYNC_CANDIDATE / ATOMIC_EXACT16_COMMIT_REQUIRED / RUNTIME_NOT_RUN. This dirty exact16 grants no API, source or runtime authority and changes no OpenAPI semantics. Source 73940810046bb3186f2746705a83565ab29368c5 (parent 9a638f75745aa0fb516a1177a33cbd1c657432fe, tree 9f994a8805b43a84c00ed50b8e5544739425edaa, subject feat(calendar): add occurrence cancellation service) has authored-first test blob 80e19d3b918ae9ddbe3b3ea8803c6062c2f8a713, repository e0da66bf95d4b8193eb5d4034053a353bd154b66, service 2b500e5cdda34d7d80d0ccc0ba9c94427167716f. Contract Terra/high, Security Terra/xhigh and Lifecycle Terra/high precommit plus immutable exact-SHA PASS C/I/M 0/0/0; author Terra/xhigh; dispatcher-enforced/no fallback; telemetry UNKNOWN. Only atomic exact16 manifest commit plus immutable triple PASS marks source STATIC_ACCEPTED / EXACT_SHA_PASS; lower 04H authority/precommit/source-unaccepted/current-next routes then are CONSUMED/HISTORICAL. No next packet or handler/runtime authority; 04J/04K, 04F-H, Ent/adapters/handlers/generation/migration/raw iTIP/launcher/runtime blocks persist.
  x-hub-calendar-143-04h-authority-acceptance-sync: >-
    Status metadata only: AUTHORITY_ACCEPTANCE_SYNC_CANDIDATE / ATOMIC_EXACT15_COMMIT_REQUIRED / IMPLEMENTATION_BLOCKED / RUNTIME_NOT_RUN. This dirty exact15 grants no API/source/runtime authority and does not change the frozen OpenAPI semantics. Immutable candidate f2966bdd50631feaa210a42a232880b21ade7e3a has Contract Terra/high, Security Terra/xhigh and Lifecycle Terra/high EXACT_SHA_PASS C/I/M 0/0/0; dispatcher-enforced/no fallback, telemetry UNKNOWN. Only after one atomic exact15 sync commit and immutable acceptance-commit PASS does f296 become SOURCE_AUTHORITY_ACCEPTED / EXACT_SHA_PASS and lower routes become CONSUMED/HISTORICAL. Root may then dispatch only ordered exact3; source remains unimplemented and every API/handler/runtime blocker persists. Acceptance-sync author Terra/xhigh, dispatcher-enforced/no fallback, telemetry UNKNOWN.
  x-hub-calendar-143-04h-authority-candidate: >-
    Status metadata and frozen contract only: ROOT_SOURCE_AUTHORITY_CANDIDATE / PRECOMMIT_REVIEW_REQUIRED / ATOMIC_EXACT15_COMMIT_REQUIRED / IMPLEMENTATION_BLOCKED / RUNTIME_NOT_RUN. This dirty exact15 grants no handler, adapter, source or runtime authority. Occurrence cancellation is organizer-only and nondisclosing, uses canonical recurrence_id, writes one cancelled exception and one safe content-free calendar.invite.cancelled.v1 EnvelopeV1, and never creates raw iTIP or calls EventSerializer. Source exact3 remains UNIMPLEMENTED / UNCOMMITTED / UNACCEPTED until triple precommit PASS, atomic exact15 candidate commit, triple immutable exact-SHA PASS and a separate accepted exact15 sync. Legacy METHOD:CANCEL/143-02A/source-first 04H clauses are CONSUMED/HISTORICAL; 04F-H, Ent/adapters/handlers/wiring/generation/migration/AQ/launcher/runtime remain blocked. Author Terra/xhigh, dispatcher-enforced/no fallback, telemetry UNKNOWN.
