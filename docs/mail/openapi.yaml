    CalendarEvent:
      type: object
      required: [id, uid, title, all_day, timezone, sequence, source, status, organizer_email, attendees, version]
      x-hub-temporal-invariant: relevant end must be strictly after start
      allOf:
        - if:
            properties:
              all_day: {const: true}
            required: [all_day]
          then:
            required: [starts_at, ends_at, start_date, end_date_exclusive]
            properties:
              starts_at: {type: "null"}
              ends_at: {type: "null"}
              start_date: {type: string, format: date}
              end_date_exclusive: {type: string, format: date}
        - if:
            properties:
              all_day: {const: false}
            required: [all_day]
          then:
            required: [starts_at, ends_at, start_date, end_date_exclusive]
            properties:
              starts_at: {type: string, format: date-time}
              ends_at: {type: string, format: date-time}
              start_date: {type: "null"}
              end_date_exclusive: {type: "null"}
      properties:
        id: {type: string, format: uuid}
        uid: {type: string, maxLength: 255}
        title: {type: string, maxLength: 500}
        description: {type: string, maxLength: 200000}
        location: {type: string, maxLength: 500}
        starts_at: {type: [string, "null"], format: date-time}
        ends_at: {type: [string, "null"], format: date-time}
        start_date: {type: [string, "null"], format: date}
        end_date_exclusive: {type: [string, "null"], format: date}
        all_day: {type: boolean}
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: Canonical name validated against the runtime IANA timezone database
          x-hub-validation: iana-timezone
        rrule: {type: [string, "null"], maxLength: 1000}
        exdates:
          type: array
          maxItems: 1000
          items: {type: string}
        sequence: {type: integer, minimum: 0}
        source: {type: string, enum: [hub, mail_import, ical_feed]}
        status: {type: string, enum: [confirmed, tentative, cancelled]}
        organizer_id: {type: [string, "null"], format: uuid}
        organizer_email: {type: string, format: email}
        scheduled_call_id: {type: [string, "null"], format: uuid}
        reminder_minutes:
          type: [integer, "null"]
          minimum: 0
          maximum: 40320
          description: >-
            Local scheduling metadata; null disables reminders. All-day due uses the first
            representable instant of the event-local civil start date. A reminder-only
            update advances event version but not iTIP sequence or attendee RSVP.
        attendees:
