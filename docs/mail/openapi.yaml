      operationId: listLegacyScheduledCalls
      x-hub-authz: scheduled-call-channel-member
      description: >-
        Exact-channel-authorized compatibility list. Without range parameters the existing
        response fields are unchanged. Paired from/to adds canonical bounded occurrences;
        supplying only one bound is invalid.
      parameters:
        - name: channelId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
      x-hub-validation: from-and-to-are-both-absent-or-both-present; half-open range at most 366 days
      x-hub-response-limit: at most 100 scheduled calls, 1000 total expanded occurrences and 16777216 serialized UTF-8 bytes; overflow is a non-truncating 400
      responses:
        "200":
          description: Existing envelope with optional canonical occurrence expansion
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                x-hub-max-serialized-utf8-bytes: 16777216
                required: [scheduled_calls]
                properties:
                  scheduled_calls:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/ScheduledCall"}
        "400": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}
