# docker-compose.local.yml
# Полный локальный стек Hub — всё в Docker, одна команда.
# Запуск: docker compose --env-file .env.local -f docker-compose.local.yml up --build
# Или:  bash scripts/dev-docker-up.sh   /   pwsh scripts/dev-docker-up.ps1
# (скопируйте .env.local.example → .env.local для Resend/Telegram)
# Доступ: http://localhost:8080  ·  API: http://localhost:3000  ·  DEV_MODE=true

x-qa-common: &qa-common
  profiles: [qa]
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  init: true
  pids_limit: 256
  cpus: 2.0
  mem_limit: 2g
  volumes:
    - ./testframework/reports:/reports
  networks: [qa-internal]
  stop_grace_period: 30s
  tmpfs:
    - "/tmp:rw,noexec,nosuid,nodev,size=64m"

x-qa-python: &qa-python
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTEST_ADDOPTS: "-p no:cacheprovider"
    PYTHONSAFEPATH: "1"

x-qa-infrastructure: &qa-infrastructure
  profiles: [qa]
  networks: [qa-internal]
  pids_limit: 128
  cpus: 1.0
  mem_limit: 1g
  stop_grace_period: 30s

x-schema-maintenance-common: &schema-maintenance-common
  profiles: [schema-maintenance]
  platform: linux/amd64
  build:
    context: ./backend
    dockerfile: docker/Dockerfile.schema-maintenance
    target: schema-maintenance
  user: "10001:10001"
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  init: true
  pids_limit: 128
  cpus: 1.0
  mem_limit: 1g
  restart: "no"
  stop_grace_period: 30s
  tmpfs:
    - "/work:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0700"
    - "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770"

x-schema-maintenance-tool: &schema-maintenance-tool
  <<: *schema-maintenance-common
  mem_limit: 4g
  tmpfs:
    - "/work:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0700"
    - "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770"
    - "/run/go-run-exec:rw,exec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700"
    - "/opt/hub/backend/.entc:rw,noexec,nosuid,nodev,size=8m,uid=10001,gid=10001,mode=0700"
    - "/opt/hub/prefeature/backend/.entc:rw,noexec,nosuid,nodev,size=8m,uid=10001,gid=10001,mode=0700"
  environment:
    DATABASE_URL: "postgres://schema@schema-maintenance-postgres:5432/hub_schema?sslmode=disable&search_path=public"
    PREFEATURE_SCHEMA_URL: "postgres://schema@schema-maintenance-postgres:5432/hub_schema_prefeature?sslmode=disable&search_path=hub_mail_calendar"
    CURRENT_SCHEMA_URL: "postgres://schema@schema-maintenance-postgres:5432/hub_schema_current?sslmode=disable&search_path=hub_mail_calendar"
    VERIFICATION_SCHEMA_URL: "postgres://schema@schema-maintenance-postgres:5432/hub_schema_verification?sslmode=disable&search_path=hub_mail_calendar"
    ATLAS_DIFF_DEV_URL: "postgres://schema@schema-maintenance-postgres:5432/hub_schema_atlas_diff_dev?sslmode=disable&search_path=hub_mail_calendar"
    ATLAS_VALIDATE_DEV_URL: "postgres://schema@schema-maintenance-postgres:5432/hub_schema_atlas_validate_dev?sslmode=disable&search_path=hub_mail_calendar"
    ATLAS_LINT_DEV_URL: "postgres://schema@schema-maintenance-postgres:5432/hub_schema_atlas_lint_dev?sslmode=disable&search_path=hub_mail_calendar"
    ATLAS_COMPARE_DEV_URL: "postgres://schema@schema-maintenance-postgres:5432/hub_schema_atlas_compare_dev?sslmode=disable&search_path=hub_mail_calendar"
    ATLAS_REVISIONS_URL: "postgres://schema@schema-maintenance-postgres:5432/hub_schema_verification?sslmode=disable&search_path=atlas_revisions"
  depends_on:
    schema-maintenance-postgres:
      condition: service_healthy
  networks: [schema-maintenance-internal]
services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: hub
      MONGO_INITDB_ROOT_PASSWORD: hub
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.11
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "--store_dir", "/data"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "nats-server", "--signal", "ldm"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-s3", "-dir=/data", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "9333:9333"
      - "8333:8333"
    volumes:
      - seaweeddata:/data
      - ./deployments/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  # LiveKit — на Windows сузьте UDP-диапазон (Hyper-V резервирует порты).
  # Если bind UDP failed: docker compose up -d --no-deps backend frontend hub-mail
  livekit:
    image: livekit/livekit-server:v1.8
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50010:50000-50010/udp"
    volumes:
      - ./deployments/livekit.yaml:/etc/livekit.yaml:ro
    command: ["--config", "/etc/livekit.yaml"]
    depends_on:
      redis:
        condition: service_healthy

  # Опционально: глобальный поиск Meilisearch (profile: search)
  meilisearch:
    profiles: ["search"]
    image: getmeili/meilisearch:v1.12
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: hub-dev-master-key
    volumes:
      - meilidata:/meili_data

  hub-mail:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GO_BUILD_TAGS: release
    entrypoint: ["./hub-mail"]
    ports:
      - "3001:3001"
    environment:
      HUB_MAIL_PORT: "3001"
      HUB_MAIL_INTERNAL_TOKEN: "${HUB_MAIL_INTERNAL_TOKEN:-local-dev-mail-token}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      RESEND_FROM_EMAIL: "${RESEND_FROM_EMAIL:-onboarding@resend.dev}"
      RESEND_FROM_ALERTS: "${RESEND_FROM_ALERTS:-alerts@hub.local}"
      MAIL_DAILY_LIMIT: "${MAIL_DAILY_LIMIT:-20}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Пусто = dev-сборка с /api/dev/* (seed, dev-login)
        GO_BUILD_TAGS: ""
    ports:
      - "3000:3000"
    environment:
      SERVER_PORT: "3000"
      FIBER_IMMUTABLE: "true"
      ENVIRONMENT: development
      DEV_MODE: "true"
      DATABASE_URL: "postgresql://hub:hub@postgres:5432/hub?sslmode=disable"
      MONGODB_URL: "mongodb://hub:hub@mongo:27017/?authSource=admin"
      MONGODB_DATABASE: "hub"
      REDIS_URL: "redis://redis:6379/0"
      NATS_URL: "nats://nats:4222"
      S3_ENDPOINT: "http://seaweedfs:8333"
      S3_ACCESS_KEY: "hub"
      S3_SECRET_KEY: "hubsecret"
      S3_BUCKET: "hub"
      S3_REGION: "us-east-1"
      S3_USE_SSL: "false"
      JWT_SECRET: "local-dev-secret-change-in-production"
      # INF-03: ключи через .env.local, не хардкодить в compose
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      RESEND_FROM_EMAIL: "${RESEND_FROM_EMAIL:-onboarding@resend.dev}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      LIVEKIT_URL: "http://livekit:7880"
      LIVEKIT_API_KEY: "devkey-hub-local-development-2026"
      LIVEKIT_API_SECRET: "devsecret-hub-local-minimum-32-chars-ok"
      HUB_MAIL_URL: "http://hub-mail:3001"
      HUB_MAIL_INTERNAL_TOKEN: "${HUB_MAIL_INTERNAL_TOKEN:-local-dev-mail-token}"
      RESEND_FROM_ALERTS: "${RESEND_FROM_ALERTS:-alerts@hub.local}"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      seaweedfs:
        condition: service_started
      hub-mail:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  schema-maintenance-baseline:
    <<: *schema-maintenance-tool
    command: ["baseline"]

  schema-maintenance-diff:
    <<: *schema-maintenance-tool
    command: ["diff"]

  schema-maintenance-generate:
    <<: *schema-maintenance-common
    command: ["generate"]
    network_mode: none
    mem_limit: 4g
    tmpfs:
      - "/work:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0700"
      - "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770"
      - "/run/go-run-exec:rw,exec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700"

  schema-maintenance-hash:
    <<: *schema-maintenance-common
    command: ["hash"]
    network_mode: none

  schema-maintenance-verify:
    <<: *schema-maintenance-tool
    command: ["verify"]

  schema-maintenance-postgres:
    profiles: [schema-maintenance]
    platform: linux/amd64
    image: postgres@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
    user: "999:999"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    init: true
    pids_limit: 128
    cpus: 1.0
    mem_limit: 1g
    restart: "no"
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: schema
      POSTGRES_DB: hub_schema
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schema -d hub_schema"]
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 5s
    tmpfs:
      - "/var/lib/postgresql/data:rw,noexec,nosuid,nodev,size=512m,uid=999,gid=999,mode=0700"
      - "/var/run/postgresql:rw,noexec,nosuid,nodev,size=8m,uid=999,gid=999,mode=0775"
      - "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=999,gid=999,mode=1770"
    networks: [schema-maintenance-internal]
  backend-unit:
    <<: *qa-common
    cpus: ${HUB_BACKEND_UNIT_CPUS:-4.0}
    mem_limit: 8g
    environment:
      GOFLAGS: "-p=1"
      GOMAXPROCS: "2"
    build:
      context: .
      dockerfile: testframework/docker/Dockerfile.qa
      target: backend-unit
    command: []

  frontend-unit:
    <<: *qa-common
    build:
      context: .
      dockerfile: testframework/docker/Dockerfile.qa
      target: frontend-unit
    command: []

  python-contract:
    <<: [*qa-common, *qa-python]
    build:
      context: .
      dockerfile: testframework/docker/Dockerfile.qa
      target: python-tests
    command: [contract]

  python-api:
    <<: [*qa-common, *qa-python]
    build:
      context: .
      dockerfile: testframework/docker/Dockerfile.qa
      target: python-tests
    command: [api]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      PYTHONSAFEPATH: "1"
      HUB_QA_API_BASE_URL: "http://qa-backend:3000/"
      HUB_QA_MAIL_CALENDAR_TOKEN: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    depends_on:
      qa-backend:
        condition: service_healthy

  python-integration:
    <<: [*qa-common, *qa-python]
    build:
      context: .
      dockerfile: testframework/docker/Dockerfile.qa
      target: python-tests
    command: [integration]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      PYTHONSAFEPATH: "1"
      HUB_QA_API_BASE_URL: "http://qa-backend:3000/"
      HUB_QA_MAIL_CALENDAR_TOKEN: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    depends_on:
      qa-postgres:
        condition: service_healthy
      qa-mongo:
        condition: service_healthy
      qa-redis:
        condition: service_healthy
      qa-nats:
        condition: service_healthy
      qa-seaweedfs:
        condition: service_healthy
      qa-backend:
        condition: service_healthy

  python-e2e-smoke:
    <<: [*qa-common, *qa-python]
    build:
      context: .
      dockerfile: testframework/docker/Dockerfile.qa
      target: python-e2e
    command: [e2e-smoke]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      PYTHONSAFEPATH: "1"
      HUB_QA_API_BASE_URL: "http://qa-backend:3000/"
      HUB_QA_MAIL_CALENDAR_TOKEN: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      HUB_QA_FRONTEND_BASE_URL: "http://qa-frontend:8080/"
    depends_on:
      qa-postgres:
        condition: service_healthy
      qa-mongo:
        condition: service_healthy
      qa-redis:
        condition: service_healthy
      qa-nats:
        condition: service_healthy
      qa-seaweedfs:
        condition: service_healthy
      qa-backend:
        condition: service_healthy
      qa-frontend:
        condition: service_healthy

  python-e2e-full:
    <<: [*qa-common, *qa-python]
    build:
      context: .
      dockerfile: testframework/docker/Dockerfile.qa
      target: python-e2e
    command: [e2e-full]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      PYTHONSAFEPATH: "1"
      HUB_QA_API_BASE_URL: "http://qa-backend:3000/"
      HUB_QA_MAIL_CALENDAR_TOKEN: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      HUB_QA_FRONTEND_BASE_URL: "http://qa-frontend:8080/"
    depends_on:
      qa-postgres:
        condition: service_healthy
      qa-mongo:
        condition: service_healthy
      qa-redis:
        condition: service_healthy
      qa-nats:
        condition: service_healthy
      qa-seaweedfs:
        condition: service_healthy
      qa-backend:
        condition: service_healthy
      qa-frontend:
        condition: service_healthy

  python-load:
    <<: [*qa-common, *qa-python]
    build:
      context: .
      dockerfile: testframework/docker/Dockerfile.qa
      target: python-tests
    command: [load]

  qa-backend:
    <<: *qa-common
    init: false
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: qa-runtime
      args:
        GO_BUILD_TAGS: qa
    user: "10001:10001"
    restart: "no"
    networks:
      qa-internal:
        aliases: [backend]
    environment:
      SERVER_PORT: "3000"
      FIBER_IMMUTABLE: "true"
      ENVIRONMENT: "development"
      DEV_MODE: "true"
      DATABASE_URL: "postgresql://hubqa:hubqa-local-only@qa-postgres:5432/hubqa?sslmode=disable"
      MONGODB_URL: "mongodb://hubqa:hubqa-local-only@qa-mongo:27017/?authSource=admin"
      MONGODB_DATABASE: "hubqa"
      REDIS_URL: "redis://qa-redis:6379/0"
      NATS_URL: "nats://qa-nats:4222"
      S3_ENDPOINT: "http://qa-seaweedfs:8333"
      S3_ACCESS_KEY: "hubqa-access"
      S3_SECRET_KEY: "hubqa-secret-local-only"
      S3_BUCKET: "hubqa"
      S3_REGION: "us-east-1"
      S3_USE_SSL: "false"
      JWT_SECRET: "qa-local-jwt-secret-mail-calendar-not-for-production"
      HUB_QA_MAIL_CALENDAR_TOKEN: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      AI_OFFLINE_ONLY: "true"
    depends_on:
      qa-postgres:
        condition: service_healthy
      qa-mongo:
        condition: service_healthy
      qa-redis:
        condition: service_healthy
      qa-nats:
        condition: service_healthy
      qa-seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  qa-frontend:
    <<: *qa-common
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: qa-runtime
    user: "101:101"
    restart: "no"
    depends_on:
      qa-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  qa-lock:
    profiles: [qa-maintenance]
    build:
      context: .
      dockerfile: testframework/docker/Dockerfile.qa
      target: python-lock
    command: ["--project", "/workspace/testframework"]
    volumes:
      - type: bind
        source: ./testframework
        target: /workspace/testframework
        read_only: false
    read_only: true
    user: "1000:1000"
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1770"
      - "/home/hubqa:rw,noexec,nosuid,nodev,size=32m,uid=1000,gid=1000,mode=0700"
      - "/opt/hub/uv-cache:rw,noexec,nosuid,nodev,size=512m,uid=1000,gid=1000,mode=0700"
    environment:
      HOME: /home/hubqa
      UV_CACHE_DIR: /opt/hub/uv-cache
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    init: true
    pids_limit: 128
    cpus: 1.0
    mem_limit: 1g
    stop_grace_period: 30s

  qa-postgres:
    <<: *qa-infrastructure
    image: postgres:17
    environment:
      POSTGRES_USER: hubqa
      POSTGRES_PASSWORD: hubqa-local-only
      POSTGRES_DB: hubqa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubqa -d hubqa"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    tmpfs:
      - "/var/lib/postgresql/data:rw,noexec,nosuid,nodev,size=512m"

  qa-mongo:
    <<: *qa-infrastructure
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: hubqa
      MONGO_INITDB_ROOT_PASSWORD: hubqa-local-only
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    tmpfs:
      - "/data/db:rw,noexec,nosuid,nodev,size=512m"

  qa-redis:
    <<: *qa-infrastructure
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    tmpfs:
      - "/data:rw,noexec,nosuid,nodev,size=256m"

  qa-nats:
    <<: *qa-infrastructure
    image: nats:2.11
    command: ["-js", "--store_dir", "/data", "-m", "8222"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO-
          'http://127.0.0.1:8222/healthz?js-enabled-only=true'
          >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    tmpfs:
      - "/data:rw,noexec,nosuid,nodev,size=256m"

  qa-seaweedfs:
    <<: *qa-infrastructure
    image: chrislusf/seaweedfs:3.97
    command:
      - server
      - -s3
      - -dir=/data
      - -s3.config=/etc/seaweedfs/s3.json
    configs:
      - source: qa-seaweedfs-s3
        target: /etc/seaweedfs/s3.json
        mode: "0444"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -r /etc/seaweedfs/s3.json &&
          grep -q '"accessKey": "hubqa-access"' /etc/seaweedfs/s3.json &&
          wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null &&
          wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 |
          grep -q ' 403 '
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    tmpfs:
      - "/data:rw,noexec,nosuid,nodev,size=512m"

volumes:
  pgdata:
  mongodata:
  natsdata:
  seaweeddata:
  meilidata:

networks:
  qa-internal:
    internal: true

  schema-maintenance-internal:
    internal: true
configs:
  qa-seaweedfs-s3:
    content: |
      {
        "identities": [
          {
            "name": "hubqa-s3",
            "credentials": [
              {
                "accessKey": "hubqa-access",
                "secretKey": "hubqa-secret-local-only"
              }
            ],
            "actions": ["Admin", "Read", "List", "Tagging", "Write"]
          }
        ]
      }
